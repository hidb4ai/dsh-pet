# Manually convert bundled VP9-alpha WebM assets to Safari-compatible HEVC-alpha MOV.
# ffmpeg decodes to BGRA; the Swift AVAssetWriter encoder preserves alpha through
# Apple's hevcWithAlpha API. This avoids ffmpeg hevc_videotoolbox format limitations.
# Upload a complete ZIP to the fixed assets-mov release. Recreate that release and tag
# on each run so stable download links point to the newly encoded assets.

name: hevc-alpha

on:
  workflow_dispatch:

# Creating releases and deleting old tags require contents:write.
permissions:
  contents: write

concurrency:
  group: hevc-alpha
  cancel-in-progress: false

jobs:
  encode:
    # AVFoundation hevcWithAlpha encoding requires macOS.
    # Pin macos-15; the previous macos-14 arm64 configuration was unavailable.
    # VideoToolbox bitrate mappings vary across macOS versions:
    # recheck output sizes and quality whenever changing runners.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out assets and encoding scripts
        uses: actions/checkout@v4

      - name: Install ffmpeg for decoding
        run: |
          brew install ffmpeg
          ffmpeg -version | head -n 1

      - name: Encode HEVC with alpha using Swift
        run: |
          chmod +x scripts/encode_hevc_alpha.sh
          # Read assets/webm and write converted files to assets/mov.
          mkdir -p dsh-pet/assets/mov
          ./scripts/encode_hevc_alpha.sh dsh-pet/assets/webm dsh-pet/assets/mov
          echo "MOV files: $(ls dsh-pet/assets/mov/*.mov 2>/dev/null | wc -l)"

      - name: Verify the hvc1 tag and alpha channel
        run: |
          python scripts/check_alpha.py $(ls dsh-pet/assets/mov/*.mov | head -n 3)
          for f in $(ls dsh-pet/assets/mov/*.mov | head -n 2); do
            echo "=== $(basename "$f") ==="
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_tag_string,codec_name,width,height \
              -of csv=p=0 "$f"
          done

      - name: Select the release tag
        id: release
        run: |
          # Use a stable tag, paired with the assets-videos source release.
          tag="assets-mov"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag"
          # Expose the MOV count for the release description.
          echo "count=$(ls dsh-pet/assets/mov/*.mov | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Remove the previous release and tag
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          # Delete the old release and tag; absence is harmless.
          gh release delete "$tag" --yes --cleanup-tag || true
          # Remove any remote tag left behind by gh.
          git push origin ":refs/tags/$tag" || true
          git tag -d "$tag" 2>/dev/null || true
          echo "cleaned old release/tag: $tag"

      - name: Archive all converted assets
        run: |
          set -euo pipefail
          # Write the archive beneath GITHUB_WORKSPACE/dsh-pet/assets/.
          # Python zipfile avoids macOS zip exit-code issues with Chinese filenames.
          zip_path="$(pwd)/dsh-pet/assets/dsh-pet-mov-${{ steps.release.outputs.tag }}.zip"
          python3 - "$zip_path" <<'EOF'
          import sys, zipfile, glob
          zp = sys.argv[1]
          movs = sorted(glob.glob('dsh-pet/assets/mov/*.mov'))
          assert movs, 'no mov files to pack'
          with zipfile.ZipFile(zp, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for f in movs:
                  z.write(f, arcname=f.rsplit('/', 1)[-1])
          EOF
          echo "zip: $zip_path ($(du -h "$zip_path" | cut -f1))"
          # Read entries back with zipfile to avoid pipeline counting errors under pipefail.
          python3 - "$zip_path" <<'EOF'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = z.namelist()
          movs = [n for n in names if n.endswith('.mov')]
          print(f'entries={len(names)} mov={len(movs)}')
          assert movs and len(movs) == len(names), 'Invalid archive: expected only .mov files'
          EOF

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: dsh-pet macOS assets (HEVC-alpha .mov)${{ steps.release.outputs.tag }}
          body: |
            Transparent desktop pet assets for macOS (HEVC-with-Alpha .mov, hvc1 tag).

            - Source: `dsh-pet/assets/webm/*.webm` (VP9-alpha, ${{ steps.release.outputs.count }} files)
            - Encoder: `scripts/encode_hevc_alpha.sh` (ffmpeg decoding + AVFoundation hevcWithAlpha)
            - Use these MOV files where Safari/WKWebView cannot render WebM alpha.
            - Extract into the asset directory; filenames match their WebM counterparts.

            Generated by the hevc-alpha workflow. Each run recreates the same release tag at the new commit.
          files: ${{ github.workspace }}/dsh-pet/assets/dsh-pet-mov-${{ steps.release.outputs.tag }}.zip
          fail_on_unmatched_files: true
