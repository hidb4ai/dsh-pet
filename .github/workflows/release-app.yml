# Build the Windows x64 desktop archive and attach it to an existing Release.
# The main release workflow owns release notes; this workflow only uploads assets.
# Manual runs check out the requested tag, including when rebuilding old versions.
# Keep the archive name stable for release download links. Its inner folder includes
# the package version. Only GITHUB_TOKEN with contents:write is required.

name: release-app

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach (for example v0.1.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-app-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # The package lives in dsh-pet; run steps use that directory by default.
        working-directory: dsh-pet

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v4
        with:
          # Rebuild the tagged version even when the default branch has moved on.
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify package and tag versions
        run: |
          if (-not $env:TAG.StartsWith('v')) {
            Write-Error "Tag must start with v; received: $env:TAG"
            exit 1
          }
          # Integration tags v<version>-test[.N] validate the base version.
          # Use a proper version tag for publication and mark prereleases accordingly.
          $base = $env:TAG -replace '-test(\.\d+)?$', ''
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $base) {
            Write-Error "Tag $env:TAG has base version $base, but package.json is v$version. Align the version before tagging."
            exit 1
          }
          if ($base -ne $env:TAG) { "Integration tag: $env:TAG (base version $base matches)" } else { "Version matches: $env:TAG" }

      - name: Build bundles
        run: pnpm run bundle

      # shared-core.js exposes window.PetShared from src/shared and is not tracked.
      # The desktop renderer cannot start without this generated dependency.
      # prepare.js builds it during packaging; this bundle-only path must do so explicitly.
      - name: Build the shared desktop core
        run: pnpm run build:desktop-core

      - name: Check types
        run: pnpm run typecheck

      - name: Package the desktop application
        env:
          DSH_PET_ALLOW_ELECTRON_DOWNLOAD: "1"
        run: npm run dist

      - name: Create the archive with a stable filename
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $inner = "dsh-pet-$version-win-x64"
          $zip = Join-Path $env:GITHUB_WORKSPACE 'dsh-pet-win-x64.zip'

          New-Item -ItemType Directory -Path "stage/$inner" -Force | Out-Null
          Copy-Item -Path "dist-app/win-unpacked/*" -Destination "stage/$inner" -Recurse

          # Prefer 7z: Compress-Archive is slower and uses more memory for these large assets.
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            Push-Location stage
            7z a -tzip -mx=5 $zip $inner | Out-Null
            Pop-Location
          } else {
            Compress-Archive -Path "stage/$inner" -DestinationPath $zip -CompressionLevel Optimal
          }

          $size = (Get-Item $zip).Length / 1MB
          "zip: $zip ({0:N1} MB)" -f $size
          if ($size -lt 50) { Write-Error "Archive too small ({0:N1} MB); packaging may be incomplete" -f $size; exit 1 }

      - name: Upload the build artifact for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-win-x64
          path: dsh-pet-win-x64.zip
          retention-days: 7
          if-no-files-found: error

      - name: Wait for the existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The API may briefly lag release creation; manual runs also require an existing Release.
          for ($i = 1; $i -le 6; $i++) {
            gh release view $env:TAG *> $null
            if ($LASTEXITCODE -eq 0) { "Release $env:TAG is ready"; exit 0 }
            "Release $env:TAG not found (attempt $i); retrying in 10 seconds..."
            Start-Sleep -Seconds 10
          }
          Write-Error "Release $env:TAG was not found. Publish its GitHub Release with notes, then rerun this workflow."
          exit 1

      - name: Attach the archive to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The ZIP is in GITHUB_WORKSPACE while run steps default to dsh-pet/.
          # Use an absolute path so gh can find it from either directory.
          $zip = Join-Path $env:GITHUB_WORKSPACE 'dsh-pet-win-x64.zip'
          if (-not (Test-Path $zip)) { Write-Error "Archive to upload was not found: $zip"; exit 1 }
          "Uploading {0} ({1:N1} MB) to release {2}" -f $zip, ((Get-Item $zip).Length / 1MB), $env:TAG
          gh release upload $env:TAG $zip --clobber
