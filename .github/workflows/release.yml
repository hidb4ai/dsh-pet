name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or PR ref to validate and package; never publishes."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dsh-pet
    outputs:
      archive: ${{ steps.metadata.outputs.archive }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate package and release version
        id: metadata
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          node scripts/release-metadata.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Unit tests
        run: pnpm test

      # npm pack 的 prepack 已包含构建、类型、lint、格式、循环依赖、桌面运行时与 OpenAPI 检查。
      - name: Build and pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: UI and script tests
        run: pnpm test:ui

      - name: Test installed package
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          DSH_HOME: ${{ runner.temp }}/pet-smoke-home
        run: |
          npm install --prefix "$RUNNER_TEMP/pet-smoke" --ignore-scripts --omit=dev --legacy-peer-deps "$RUNNER_TEMP/release/$ARCHIVE"
          "$RUNNER_TEMP/pet-smoke/node_modules/.bin/dsh-pet-powercontext" --help
          "$RUNNER_TEMP/pet-smoke/node_modules/.bin/dsh-pet-powercontext" --check

      - name: Create checksum
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum "$ARCHIVE" > SHA256SUMS

      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/release

      - name: Verify checksum
        working-directory: ${{ runner.temp }}/release
        run: sha256sum --check SHA256SUMS

      - name: Setup Node.js
        if: vars.NPM_PUBLISH == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # 发布同一份已测试归档；令牌只提供给此步骤，包内生命周期脚本不再执行。
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
          NPM_TAG: ${{ needs.build.outputs.npm_tag }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::NPM_PUBLISH is true but NPM_TOKEN is not configured.'
            exit 1
          fi
          npm publish "$RUNNER_TEMP/release/$ARCHIVE" --access public --tag "$NPM_TAG" --ignore-scripts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/SHA256SUMS

  desktop:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release-app.yml
    with:
      tag: ${{ github.ref_name }}
