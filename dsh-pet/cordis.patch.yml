# Mount this bundle in the DSH configuration tree.
# Each entry ID must be globally unique and match the package name for store validation.
# Keep the id line free of trailing comments: the store preflight reads it with a regex.
# name resolves to lib/index.js; dsh.client also exposes the browser entry declared
# in package.json at /plugins/dsh-pet-powercontext/client.js.

- insert:
    - id: dsh-pet-powercontext
      name: 'dsh-pet-powercontext'
