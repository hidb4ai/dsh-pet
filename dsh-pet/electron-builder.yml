# Package the standalone pet as a Windows desktop application.
# lib/app.js bundles dependencies except Electron and the download-only dynamic imports
# (@electron/get and @electron-internal/extract-zip; see tsdown.config.mjs).
# scripts/dist.mjs supplies an extracted local electronDist to reuse cached downloads.
# Assets remain in asar and are read through the main process; no native unpack is needed.
appId: com.pc2005.dsh-pet
productName: dsh-pet
copyright: dsh-pet contributors

directories:
  output: dist-app

# Override only packaged app metadata; package.json main remains the DSH plugin entry.
extraMetadata:
  main: lib/app.js

files:
  - lib/**
  - runtime/**
  # Include runtime assets, excluding the README preview GIFs.
  # Keep this allowlist aligned with package.json files when adding asset directories:
  # plugin mode reads ordinary files, while the desktop app reads this asar archive.
  - assets/webm/**
  - assets/fonts/**
  - assets/pic/**
  - assets/memes/**
  - assets/sound/**
  - assets/config.jsonc
  - assets/logo.png
  - package.json
  - '!node_modules/**'

asar: true
npmRebuild: false

# Keep this aligned with the default @electron/get download version.
electronVersion: 43.3.0
# dist.mjs passes --config.electronDist=<extracted-directory> explicitly. This field
# does not expand environment macros, so do not store an interpolated path here.
# Distribute win-unpacked as a ZIP. A directory build avoids portable startup extraction.
# To add an NSIS installer, configure its target, wizard, shortcuts and uninstaller.
win:
  icon: assets/logo.png
  target:
    - dir
