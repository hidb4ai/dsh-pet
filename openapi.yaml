openapi: 3.1.0

info:
  title: dsh-pet HTTP API
  version: 0.1.0-beta.1
  summary: Host HTTP API for the DSH desktop pet
  description: |
    The plugin registers `/dsh-pet-7340` with DSH's `webServer` service. Browser settings,
    the pet renderer and the Electron bridge share the same `handlePetRoute` implementation.
    This contract describes those plugin routes; standalone setup also has its own local routes.

    ## Runtime and authentication

    In DSH, `{port}` is `ctx.webServer.port`; use the address printed by `dsh web`.
    The plugin does not choose DSH's bind address or bypass DSH authentication. Use the host's
    authenticated session. Do not assume a loopback address makes a request unauthenticated.

    Standalone binds to loopback, checks request origins and requires its local capability
    credential for protected operations. Its setup URL is a credential: do not publish or log it.
    See the repository's HTTP reference for the supported access flow.

    The desktop renderer uses `dsh-pet-bridge://`, forwarding through the main process to the
    same route handler. An HTTP acknowledgement does not prove an animation was displayed;
    inspect the playback receipt when completion matters.

    ## State and commands

    `GET /state` returns the published in-memory state. Each leaf has `{ counter, data }`.
    Consumers compare counters with their last observed values and render only changed leaves.
    A counter uses the current timestamp and advances for successive writes within one millisecond.

    Action endpoints such as `/balance`, `/broadcast`, `/bubble/clear` and `/anim` update state
    and acknowledge the command. Fetch `/state` after acknowledgement to observe its result.
    `/whisper` and `/chat` also return generated text (and an image when present), while publishing
    the same content to state for other consumers.

    ## Responses

    Handler-level business failures normally return HTTP 200 with `ok: false` and a stable
    `reason`; branch on that reason. Examples include unknown pets, invalid fields, locks and
    generation failures. Transport and protocol errors use their real status: unknown route 404,
    unsupported method 405, invalid JSON 400, oversized body 413 and unexpected failure 500.
    Host authentication and standalone security checks can reject a request before the handler.

    Asset routes return binary content on success and may return plain-text 404 responses.
    Do not parse every response as the JSON failure envelope.

  license:
    name: MIT
    identifier: MIT

externalDocs:
  description: Repository and usage documentation
  url: https://github.com/ob-labs/dsh-pet-powercontext

servers:
  - url: http://127.0.0.1:{port}
    description: |
      Local DSH web server. `{port}` is `ctx.webServer.port` (default 3080 for `dsh web`).
      The fixed route prefix is `/dsh-pet-7340`; 7340 is a historical identifier, not the port.
    variables:
      port:
        default: "3080"
        description: Actual DSH web server port

tags:
  - name: State
    description: Published state polling; read-only, in-memory and without side effects
  - name: Action
    description: Commands that trigger host behavior and update published state
  - name: Config
    description: Configuration reads, writes and metadata
  - name: Assets
    description: Fonts, notification icons, memes and animations
  - name: Voice
    description: Speech synthesis with host-side validation, queuing and caching; returns MP3 on success

paths:
  /dsh-pet-7340/state:
    get:
      tags: [State]
      operationId: getState
      summary: Pull unified status S
      description: |
        Return the published in-memory state S. The following example retains an actual bundled animation ID:

        ```jsonc
        {
          "counter": 1755000000007,
          "sections": {
            "balance":    { "counter": 1755000000000, "data": { /* BalanceState */ } },
            "workStatus": { "counter": 1755000000001, "data": { /* WorkStatusSnapshot */ } },
            "notify":     { "counter": 1755000000002, "data": { /* NotifyFrame */ } },
            "config":     { "counter": 1755000000007, "data": {} },
            "menu":       { "counter": 0, "data": null },
            "focusSession": { "counter": 0, "data": null }
          },
          "pets": {
            "main": {
              "say":      { "counter": 1755000000003, "data": { "text": "……", "duration": 10000, "anim": true } },
              "anim":     { "counter": 1755000000004, "data": { "name": "东张西望" } },
              "position": { "counter": 1755000000005, "data": { "x": 0.5, "y": 0.35, "mode": "spring" } },
              "throw":    { "counter": 1755000000006, "data": { "angle": 45, "power": 1 } },
              "lock":     { "counter": 1755000000007, "data": { "locked": false } },
              "sleep":    { "counter": 0, "data": null }
            }
          }
        }
        ```

        - `sections` contains global leaves shared by all renderers; `pets.<id>` contains per-pet leaves.
        - Writing any pet leaf creates all six slots: `say`, `anim`, `position`, `throw`, `lock` and `sleep`. Unwritten leaves are `{ "counter": 0, "data": null }`; a pet with no writes has no entry.
        - `anim`, `position` and `throw` are host-to-renderer commands, not measurements. Renderers execute them without writing back. Use `/pose` for reported desktop position.
        - `lock` is occupancy state. Renderers freeze autonomous animation and suppress automatic balance/work-state presentation while occupied, then honor `expiresAt` locally. See `LockLeaf`. `sleep` separately holds the chosen sleep animation set.
        - `say` either displays `{ text, image?, duration?, anim? }` or clears with `{ "clear": true }`. Duration defaults to 10 seconds; 0 shows no bubble. `anim` defaults to true, using `events.whisper`; false shows only the bubble. Whispers/chat omit these fields and use the defaults.
        - `sections.config` is a change signal with constant `{}` data. When its counter changes, refetch `GET /config`. `POST /pet-display` and `POST /pet-config` publish it so other pages observe changes. `PUT`/`POST /config` return merged configuration directly to their caller and do not publish this signal. Manual file edits are not watched; reload after editing `main-config.jsonc` or `pet/*.json`.
        - The top-level `counter` is the revision of all S, equal to the latest write. Pass it as `since` for long polling. Zero means no leaf has been written. Counters advance on writes within this process, not on reads; state is cleared on host restart.
        - Skip leaves with null data. Unchanged counters are not network failures; transport failures instead produce a non-success HTTP status or connection error.
        - Responses use `cache-control: no-cache, no-store`. This endpoint reads memory only; it never generates model content or makes external requests.
        - Treat paths such as `pets.<id>.say` as opaque keys. Do not split on dots: pet IDs may contain dots, for example `a.b`. Use fixed prefix/suffix slicing if needed. IDs come from `pets[].id` in `GET /config`; the bundled default is `main`.

        **Long polling**

        Supply `?since=<top-level counter>&timeout=<ms>` together. If the revision matches, wait for a write or timeout; otherwise return immediately. Omitting both returns the full current state immediately.

        Fetch once without parameters, retain its counter, then long-poll with it and immediately issue the next request after each response. Idle request frequency follows timeout, while writes wake waiting callers.
      parameters:
        - name: since
          in: query
          required: false
          description: |
            The version number of S in the caller's hand (= the top-level `counter` in the previous tick response).
            Different from current → Return immediately; Same → Suspend. `0` is valid ("I have nothing in my hand").
            **Required for pairing with `timeout`**: only one is passed → `200` + `reason: bad-request`.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 1755000000007
        - name: timeout
          in: query
          required: false
          description: |
            The capped time of suspend waiting (milliseconds), only **non-negative integers** of `0..10000` are accepted.
             `0` is valid (equivalent to "return immediately"). **Required for pairing with `since`**: only one is passed → `200` + `reason: bad-request`.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
          example: 1000
      responses:
        "200":
          description: |
            Current status (during long polling: waiting for changes, or waiting for timeout).

             `since` / `timeout` is invalid (only one, non-integer, negative number, exceeding 10000) is also `200`,
            At this time the response body is `{ "ok": false, "reason": "bad-request", "message": "..." }` ——
            Parameter errors are also conclusions given by the processor.
          headers:
            cache-control:
              description: Always `no-cache, no-store`
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PollState"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/work-status:
    post:
      tags: [Action]
      operationId: setWorkStatus
      summary: Set an external work state
      description: |
        Write the fixed external work-state slot `api`. External tools and scripts can use this slot
        without creating a DSH session. `DELETE` clears it and returns the slot to idle.

        - Accepts the six states below. Omit `task` to keep its current value; use `null` or an empty string to clear it.
        - Do not send session or sequence fields. There are no writer leases or arbitration: the latest write wins.
        - The external slot competes with DSH sessions using the existing priority:
          waiting > error > working > thinking > result > success.
        - Success/error bubbles close after 10 seconds, but the work state remains until explicitly cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [thinking, working, result, waiting, success, error]
                task:
                  description: |
                    Task details copy, displayed in bubble. Up to 40 code points after `trim()`;
                    Omit = keep the original value, `null` or empty string = clear.
                  oneOf:
                    - type: string
                    - type: "null"
      responses:
        "200":
          description: |
            Write accepted; returns current external slot status and task copy.

             `state` unknown / `task` type is wrong / more than 40 code points → also `200` +
             `{ "ok": false, "reason": "bad-request", "message": "..." }`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WorkStatusSnapshot"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: "The request body is not valid JSON (`reason: invalid-json`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: "Request body exceeds 8 KiB (`reason: payload-too-large`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
    delete:
      tags: [Action]
      operationId: clearWorkStatus
      summary: clear working status of external writing
      description:
        Clear the external slot `api` and the desktop pet will return to idle; idempotent (204 will be
        returned even if there is no external slot).
      responses:
        "204":
          description: Cleared (or there is no external slot).
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/balance:
    post:
      tags: [Action]
      operationId: refreshBalance
      summary: Refresh the balance immediately
      description: |
        Use the **service provider you are currently talking to** (`ctx.agentDefaultModel.currentSelection()`) to check your balance.
        And write the result into `sections.balance`. This is the `POST` action endpoint, which does not return balance data.

        - When the balance is unavailable (the service provider does not support it/the credentials are missing/the capture failed), S is also written,
          Expressed in the form of `{ ok: false, reason, message }`; at this time, this endpoint still returns `ok: true` **,
          Because the "refresh action itself" is completed. To distinguish, read `sections.balance.data.ok`.
        - The `manual: true` mark will be added when writing (only when this refresh is actively triggered by the user),
           Based on this, the consumer decides whether to have to display a text explanation when the balance is unavailable.
        - Regular periodic refresh is completed by the host **own timer** (the period comes from the configuration
           `eventsRefreshSec.balance`, default 1800 seconds), the front end does not need to poll it.
      responses:
        "200":
          description: The refresh action has been completed (does not mean the balance is available)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/focus-session:
    post:
      tags: [Action]
      operationId: focusSession
      summary: Request the page to switch to the specified session
      description: |
        Let the page switch to the specified session. Action endpoint: just write the intent into `sections.focusSession`,
        The jump result is not returned, nor is it verified whether the session exists (unknown id is ignored by the page side).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                  description: |
                    Target session id. `trim()` must not be empty, and must not be the sentinel value `unknown`.
                    The upper limit is 128 characters; when it is not satisfied, `ok: false` + `reason: bad-request`.
                  example: session-742cf7de-d1ce-4694-bfde-77158ce9e0ca
      responses:
        "200":
          description:
            The intention has been written to `sections.focusSession` (it does not mean that the page has
            been switched).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionResponse"
        "400":
          description: "The request body is not valid JSON (`reason: invalid-json`)."
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/whisper:
    post:
      tags: [Action]
      operationId: whisper
      summary: Let the designated pet say something immediately
      description: |
        Generate a whisper according to the `whisperPrompt` persona of the entry to which the pet belongs, and write `pets.<id>.say`.
        And **the generated text (`text`) is brought back with the response (`image` when the picture matching switch is on and the picture is drawn).

        - The text is still written into `pets.<id>.say`: other consumers continue to read from `/state`, and the return value is just
          So that the calling party does not have to pull another beat - the two places are the same text, not two truths.

        - `whisperEnabled` configuration **not gating this endpoint**: that field only turns off the automatic period whisper,
          Manual/interface triggering is always available and is not affected by it.
        - When the generation fails, ** do not write S ** (no copywriting will be forged, and no error bubble will pop up), and the host will type `console.warn`.
          This endpoint returns `{ ok: false, reason: 'generate-error' }`.
        - If the pet entry has `whisperImageEnabled` enabled and the emoticon pool is not empty,
          A picture will be randomly selected and written into the `image` field of the leaf along with the text.
        - When using `?image=`, it is changed to **Only specify that one**: It is not affected by `whisperImageEnabled` gating (manual clicking of pictures is an explicit intention),
          If the name is not in the pool, `unknown-image` will be returned and it will not be silently changed to another one.
        - Model selection: `whisperModel` in the entry configuration takes precedence; leaving blank will follow the model of the current conversation.
          When the specified model generation fails, it will automatically fallback to the model of the current conversation and try again.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
        - name: image
          in: query
          required: false
          description: |
            Specify the name of the meme used this time (= the key of the entry `memes` to which the pet belongs, excluding the extension).
            If given, only use this one; if it is not in the pool (the name is wrongly written, or the image file has been deleted), `unknown-image` will be returned.
            Default = press `whisperImageEnabled` to randomly select one, or plain text.
          schema:
            type: string
      responses:
        "200":
          description: |
            Generate results. Note that the HTTP status code is **always 200** (except 405): failure is expressed through `ok: false`,
            In this way, the caller only needs to parse one level, and does not have to distinguish between "HTTP failure" and "business failure".

             `reason` Value: `provider-missing` (no model available - returned when no usable model is configured),
             `generate-error` (generation failed or IO failed with `message`), `unknown-pet` (target pet in
            The gap between "verification read" and the read before generation was deleted - rare, but reported truthfully, **will not silently press `main` to generate**,
            It will not write down a leaf that no longer exists), `unknown-image` (the name specified by `?image=` is not in the pool),
             `bad-request` (`surface` missing/invalid),
             `pet-not-displayed` (with `display`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SayResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/broadcast:
    post:
      tags: [Action]
      operationId: broadcast
      summary: Third-party feeding - writing externally given text into the bubble
      description: |
        Division of labor with `POST /whisper`: **This endpoint does not generate content**, the caller provides the text itself, and the host is only responsible for transporting it
        and display. Other plugins on the host side (for example, the "maid" inspection plugin wants to say something for the master after the inspection) use it to send the text into
         desktop pet bubble, desktop pet becomes the entity of that personality.

        Text is written into `pets.<id>.say` - the same leaf as whisper and conversation replies, so both the browser and the desktop
        Automatically displayed within 1 second, ** consumer does not need to change **. This is the action endpoint and only returns `{ ok }` , the text itself is returned from
         `/state` read.

        **Check** (if any one fails, HTTP 200 + `ok: false` will be returned, consistent with `POST /chat` conventions):

        - `text` is required and cannot be empty after `trim()`;
        - **No length limit or frequency limit**: Feeding is an explicit caller behavior, and the content and frequency are both the responsibility of the caller itself.
           host does not do silent dropping, truncation or queuing;
        - `pet` **required**, and must be a real desktop pet (not given → `pet-required`, does not exist → `unknown-pet`);
        - **Two forms of pictures, choose one** ("Resource register" in Article 1 of issue #122):
          - `image`: Only accept the name in the meme pool of the desktop pet entry (that is, the entry `memes`, and in its meme directory chain
            —— `pet/<asset-root>-memes/` (exclusive) or `memes/` → `assets/memes/` —— in the package).
            Name outside the pool → `ok: false` + `reason: unknown-image` (shares the same verification with dialogue picture selection);
          - `url`: **The third-party's own picture address**, complete URL, without checking the pool - the asset is in the caller's hands, and of course not in the pool.
             scheme only allows `http` / `https` (`file:` will allow the desktop rendering process to read any local file).
          - **Give both → `bad-request` **: The two forms are mutually exclusive. If the intention is unknown, the caller will not be guessed.
        - `duration` Optional, bubble display duration (milliseconds). Default `10000`;** `0` is a valid value**, literal meaning
          "Do not display" (the request is accepted as usual, but not rendered); negative number / `NaN` / `Infinity` / non-number → `bad-request`.
          **No upper limit** - Like content and frequency, the caller is responsible for it;
        - `anim` is optional, whether to link the `events.whisper` animation once. Default `true` (= old behavior).
          **Only close `false` strictly** (`"false"` character strings and the like will be processed as "to be linked"). renderer when closed
          **Does not check the animation pool and does not change the source**, so the absence of `events.whisper` in the pet configuration does not affect the path of "only playing bubbles".

        The two new parameters are independent of each other and each handles one thing:

        - `anim: false` + `duration: 3000` → Only play bubble for 3 seconds, no animation;
        - `anim: true` + `duration: 0` → Play animation as usual, but do not play bubbles;
        - `duration: 0` **will not** close the currently displayed bubble - that is `POST /bubble/clear`'s business,
          The two things deliberately do not overlap.

        When writing to leaves, `duration` / `anim` is the **effective value after parsing** (the default value has also been filled in with an explicit value),
        So by reading `/state`, you can see the actual effective duration and linkage switch, without having to guess what the default is.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description:
                    What to say to the desktop pet. `trim()` must not be empty after; there is no length
                    limit.
                image:
                  type: string
                  description: |
                    Optional picture **name** (configuration key of `memes` = picture file name minus extension, excluding path).
                    It must be in `memes` of the desktop pet entry and actually exist in its meme directory chain, otherwise `ok: false` +
                     `reason: unknown-image`. With `url` **choose one** (give both → `bad-request`).
                  example: 可爱
                url:
                  type: string
                  format: uri
                  description: |
                    Optional picture **address** - the picture provided by the third party, complete URL (issue #122 Article 1).
                    Do not check the emoticon pool; scheme only releases `http` / `https`, and the rest → `ok: false` + `reason: bad-request`.
                    **Choose One** with `image`.

                    **Cross-domain issues are not resolved by this plugin**: The browser-side image is `<img src>` (not controlled by CORS).
                    But the animation side uses `fetch`, and the cross-domain address requires the other party to bring `Access-Control-Allow-Origin`.
                    When the plugin and the third-party plugin are on the same DSH and the same port, the same-origin address naturally does not have this problem.
                  example: https://cdn.example.com/拒绝换壁纸.png
                duration:
                  type: number
                  minimum: 0
                  default: 10000
                  description: |
                    bubble display duration (milliseconds). Default `10000`; `0` = literal meaning "do not display" (valid value).
                    Negative number / non-finite number / non-number → `ok: false` + `reason: bad-request`. There is no upper limit.
                  example: 3000
                anim:
                  type: boolean
                  default: true
                  description: |
                    Whether to link the `events.whisper` animation once. Default `true` (old behavior).
                    **Only close `false` strictly** - all other values (including `"false"` character string) will be processed as "linkage required".
                  example: false
                speak:
                  type: boolean
                  default: false
                  description: |
                    Do you want to **read out** this sentence this time? Default `false` = only play bubbles, no sound.
                    **Only those that are strictly `true` will be broadcast** - all other values (including the `"true"` character string) will be treated as not being broadcast.
                    and `?surface=` are two gates: `speak: true` and `surface` are assigned to a specific end (`web` / `desktop`)
                    Just write `voiceTo`; `both` / `any` / without `surface`, do not specify the end, and no one will read it.
                  example: true
            examples:
              textOnly:
                summary: Just say one sentence (default 10 seconds + linkage animation)
                value:
                  text: 主人，该喝水了
              withMeme:
                summary: Bring an emoticon in the bag
                value:
                  text: 巡检完毕，一切正常
                  image: 厉害了我的鲸
              withUrl:
                summary: Bring a picture of **your own hosting** (give the complete address, no pool checking)
                value:
                  text: 巡检完毕，一切正常
                  url: https://cdn.example.com/拒绝换壁纸.png
              noAnimShort:
                summary: Only play bubble for 3 seconds, no talking animation
                value:
                  text: 该喝水了
                  duration: 3000
                  anim: false
      responses:
        "200":
          description: |
            Always 200 (except 405/400). Failure is expressed via `ok: false`, `reason` may be
             `bad-request` (empty text / invalid `duration` / `surface` missing or invalid), `pet-required` (not given to pet),
             `unknown-pet`, `unknown-image`, `generate-error` (configuration cannot be read, etc.),
             `pet-not-displayed` (with `display`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'The request body is not valid JSON (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/bubble/clear:
    post:
      tags: [Action]
      operationId: clearBubble
      summary: clear bubble ——Collapse the talking bubble currently being displayed by desktop pet
      description: |
        Write `pets.<id>.say` as a clear command, and the renderer will close the speech bubble within 1 second.
        ("Early Withdrawal" of Article 5 of issue #122). This is the opposite of `POST /broadcast`: that one writes bubble , this one closes bubble .

        **Only speaking bubbles**:

        - Balance bubble, working status bubble **not moving**;
        - `anim` / `position` / `throw` The three leaves are *not moving** - the animation being played is still playing.
           The bubble and the action are two locks, **released respectively** (issue #122 Article 5). This endpoint has no "stop animation" semantics.

        ** clear is expressed by an independent form**: what is written in the leaf is `{ "clear": true }`, **not empty text**.
        Empty text will be judged as invalid by the consumer and skipped (see `SayLeaf`), which cannot express the "clear" action.

        **Impotent**: `{ "ok": true }` is also returned when there is currently no bubble - the intention of "making the bubble disappear" has been established in the empty state.
        So there is no "bubble does not exist" failure for this endpoint.

        **Occupied validation check ** (issue #122 item 4): When it is currently occupied, only the lock holder (with the right `?lock=`) can clear——
        Otherwise, a third party will wipe out other people’s bubbles. **This step is always released when it is not occupied**, and the behavior is the same as before the transformation.

        **No request body. ** Action endpoint, only returns `{ ok }`; to confirm the effect, please read `pets.<id>.say` of `/state`.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      responses:
        "200":
          description: |
            Always 200 (except 405). Failure is expressed via `ok: false`, `reason` may be
             `pet-required` (pet is not given), `unknown-pet` (the specified id does not exist),
             `bad-request` (`surface` missing/invalid), `pet-not-displayed` (with `display`),
             `generate-error` (configuration unreadable, etc.). **Currently no bubble is not a failure. **
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/anim:
    post:
      tags: [Action]
      operationId: playAnimation
      summary: playback request animation - let desktop pet play a specified animation
      description: |
        Supply exactly one of `name` or `url`.

        **Pool animation by name**

        A `name` follows the context menu's action semantics through `handleMenuAction` or `sprite.onMenuAction`: movement animations actually move, text animations apply their usual mirror correction, and other actions play once. The host writes `pets.<id>.anim`; the renderer observes its changed counter and loads the asset.

        Names are filenames (`/dsh-pet-7340/thumb/<asset-root>/<name>.webm`) and must belong to that pet's configured animation pool. The host rejects unknown names before publication. Pool membership does not prove the file exists: a missing asset still fails during playback.

        **Third-party asset by URL**

        A full `url` bypasses the animation pool and plays once without menu semantics. Only `http`/`https` are allowed; `file:` could expose local files through the desktop renderer. After playback, the normal animation chain resumes.

        **Validation**

        Business validation failures return HTTP 200 with `ok: false`:

        - Supplying both/neither `name` and `url` returns `bad-request`.
        - `name` must be in the pet's pool; `url` must be a complete allowed URL.
        - `pet` is required (`pet-required`) and must exist (`unknown-pet`).
        - Optional `facing` must be `left` or `right`; invalid values return `bad-request` rather than being ignored.

        **Facing**

        `left` uses the asset unchanged; `right` applies `scaleX(-1)`. Omit facing to keep the renderer's current direction: the state leaf then has no facing field. An explicit direction persists until an autonomous turn or a later request changes it.

        Facing applies to both name and URL requests. An explicit right direction overrides the usual left-facing correction for `noMirror` text animations, so their text will be mirrored.

        **Origins and per-pet pools**

        Both renderers fetch assets as blobs to avoid streaming stalls. Cross-origin assets must supply their own `Access-Control-Allow-Origin`; the host does not proxy those requests. Same-origin assets on the same DSH instance need no cross-origin allowance.

        Pools belong to configuration entries. Pets in `main` share its pool; each `pet/<name>-config.json` defines another pool. Find the pet's entry in `GET /config`, then use that entry's union of `idle`, `turn`, `drag`, `clicks`, `moves.actions`, `categories` and `events`, matching the context menu after deduplication. Using a main-pet name for a pet pack may return `unknown-animation`.

        Pet-pack assets are exclusive to `pet/<asset-root>-animation/` and never fall back to bundled assets. A valid pool name whose file is missing can therefore be accepted but fail to play.

        A one-shot action returns to the normal animation chain after completion. Repeating a request advances its counter and normally replays it; a second request arriving before the renderer's previous source switch is ready can be deduplicated and appear to play only once. Inspect playback receipts when completion matters.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |-
                `name` and `url` **give exactly one**. Give both or neither → `ok: false` + `reason: bad-request`.
              properties:
                name:
                  type: string
                  description: |
                    The name of the animation to be played. It must be the name that can be clicked on the menu in the `animations` configuration of the pet.
                    (`idle`/`turn`/`drag`/`clicks`/`moves.actions`/`categories`/
                     `events` (the union of these seven types of pools), otherwise `ok: false` + `reason: unknown-animation`.
                    Choose one from `url`.
                  example: 东张西望
                url:
                  type: string
                  format: uri
                  description: |
                    The asset **address** to be played - the animation provided by the third party, complete URL (issue #122 Article 1).
                    **Do not check the animation pool**; scheme only releases `http` / `https`, the rest → `ok: false` +
                     `reason: bad-request`. Choose one with `name`.

                     The consumer does not use menu semantics (no image correction/real displacement), but only changes the source to play once.
                    Cross-domain is forced by the browser and cannot be bypassed by plugins: the external site address requires the other party to bring `Access-Control-Allow-Origin`.
                    Same source (third-party plugin registers its own route on the same DSH port) does not have this problem.
                  example: https://cdn.example.com/拉侧栏.webm
                facing:
                  type: string
                  enum: [left, right]
                  description: |
                    **Orientation** when playing this section (optional). `left` = asset as is, `right` = mirror.
                    **If not passed, the orientation will not change** (Keep the current orientation of the pet, not fallback `left`); if passed, it must be these two values
                    one, otherwise `ok: false` + `reason: bad-request` (invalid values are not silently ignored).
                    Explicit values take precedence over the mirror correction of "Text animations are forced to face left before playback request".
                  example: right
            examples:
              turn:
                summary: Play a turning animation (Chiuchi’s name)
                value:
                  name: 东张西望
              facing:
                summary: Specify orientation (right, mirror image)
                value:
                  name: 东张西望
                  facing: right
              move:
                summary: Play a moving animation (will actually walk over, consistent with the menu)
                value:
                  name: 螃蟹走路
              byUrl:
                summary: Play an animation hosted by yourself (give full address, no pool checking)
                value:
                  url: https://cdn.example.com/拉侧栏.webm
      responses:
        "200":
          description: |
            Always 200 (except 405/400). Failure is expressed via `ok: false`, `reason` may be
             `bad-request` (the name is empty/`facing` is invalid/`surface` is default or invalid), `pet-required` (pet is not given),
             `unknown-pet`, `unknown-animation`, `generate-error` (configuration cannot be read, etc.),
             `pet-not-displayed` (with `display`).
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkResponse"
                      - type: object
                        required: [playbackId]
                        properties:
                          playbackId:
                            type: string
                            description: |
                              The **receipt number** of this playback request. `ok: true` only means that the application has been accepted.
                              Use it to check `GET /playback/{id}` to know whether it has finished broadcasting.
                            example: pb-mfh2k1-1
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'The request body is not valid JSON (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/position:
    post:
      tags: [Action]
      operationId: setPetPosition
      summary: Position control - move the desktop pet to the specified position
      description: |
        Let the specified desktop pet move to the normalized coordinates and write `pets.<id>.position`; the renderer polling found within 1 second
         Executed after `counter` changes. This is the action endpoint and only returns `{ ok }` (when successful, it will also contain `x` / `y` after host clamping).

        **Coordinate semantics (the two ends are different, be sure to see clearly)**: `x` / `y` are the normalized coordinates of the pet **center**, which is valid `0~1`.
        The reason for choosing the center instead of the upper left corner is so that the caller does not have to know how old the pet is - if you use the upper left corner, you have to go to the center first.
         `GET /config` Check `size` for this pet.

        - **Browser overlay**: `0~1` is the **viewport**. `0.5` = Center of the screen.
        - **Desktop**: `0~1` is the **external rectangle** of the union of all monitor workspaces - not the main screen, nor a certain screen.
          With dual screens side by side, the `x: 0.5` falls on the seam of the two screens; when the three screens are of equal width, the `x: 1/3` is approximately equal to the left edge of the second screen.
          So **the same `x` has different meanings at both ends**, and the caller needs to know which one it is facing.

        **Out-of-bounds and unreachable items will be pinched**:

        - **Out of `0~1`**: Clamped to boundary by host before writing.
        - **Falling into multiple screen holes** (desktop version only): The bounding rectangle has **large holes that do not belong to any screen** in the irregular layout.
          (It has been measured that about 23.7% of the area of the right-reverse T double screen is empty). The landing point will be clipped to the **nearest reachable screen**, and the criterion is the same as
           host `relayout()` (pull the pet back into the visible area after the display changes) is exactly the same.

        `x` / `y` in the response is the value after host clamping.

        **Allow half of the body to appear on the screen**: It is said that `0.01` will really move there and will not press "Body Side" to clip it again.
        If the user manually drags, it will still be close to the body - the two paths do not affect each other.

        **No animation**: This is a pure position interface - no `anim` change, no walking animation. If the pet is walking, this call will
        Interrupting the walk, cleanup walk has logic.

        **Silently discarded when hitting the user's drag**: The renderer discards the beat when it finds that the finger is pressing on the pet (including clicking and dragging).
        At this time, this endpoint ** still returns `ok: true` ** - the action endpoint only indicates "accepted", not "effective" (similar to `POST /anim`
        same contract). This discarding does not change the leaf, nor is it observable by caller from `/state`.

        **`mode` is required, three motion modes** (the three paths are the existing kinematics of the renderer, this interface is only responsible for path selection):

        | `mode` | How to move |
        | --- | --- |
        | `instant` | One frame in place |
        | `spring` | Drag and follow the damping spring (`springStep`) to catch up smoothly - **no travel time**, rely on "close enough and slow enough" to cleanup |
        | `line` | The **straight line** is completed in `duration` milliseconds (pixel space interpolation), and the point is accurately positioned |

         `duration` **Required only in `line` mode** (non-negative finite number, `0` = immediately in place); `instant` / `spring`
        Even if you give it, you won’t read it — the caller often reuses the entire body template. Reporting an error will only force them to delete fields.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x, y, mode]
              properties:
                x:
                  type: number
                  description: |
                    The horizontal normalized coordinates of the pet** center** are valid `0~1`. Crossing the boundary and falling into a multi-screen hole on the desktop
                    Every drop point will be clamped (see "Coordinate Semantics" above).
                  example: 0.5
                y:
                  type: number
                  description: |
                    The vertical normalized coordinates of the pet** center** are valid `0~1`. Crossing the boundary and falling into a multi-screen hole on the desktop
                    Every drop point will be clamped (see "Coordinate Semantics" above).
                  example: 0.35
                mode:
                  type: string
                  enum: [instant, spring, line]
                  description: |-
                    Sports mode, **required**; missing or not one of the three values → `bad-request`.
                  example: line
                duration:
                  type: number
                  description: |
                    `line` mode travel time (milliseconds): **Required in this mode**, non-negative finite number, `0` = immediately in place;
                    Negative number / `NaN` / `Infinity` / non-number → `bad-request`. **No upper limit**.
                     This field is ignored in `instant` / `spring` mode.
                  example: 1200
              examples:
                instant:
                  summary: Jump to the lower left corner immediately
                  value:
                    x: 0.05
                    y: 0.9
                    mode: instant
                spring:
                  summary: The spring moves smoothly to the upper center of the screen
                  value:
                    x: 0.5
                    y: 0.35
                    mode: spring
                line:
                  summary: 1.2 seconds to go straight to the upper center of the screen
                  value:
                    x: 0.5
                    y: 0.35
                    mode: line
                    duration: 1200
      responses:
        "200":
          description: |
            Always 200 (except 405/400): Failure is expressed through `ok: false`, so the caller only needs to parse one level.
            When successful, additional `x` / `y` will be returned - ** value after host clamping **.
             `reason` also has: `bad-request` (invalid coordinates/mode/`surface` missing or invalid),
             `pet-not-displayed` (with `display`).
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkResponse"
                      - type: object
                        required: [x, y]
                        properties:
                          x:
                            type: number
                            description: Actual effective horizontal coordinate (after clamping)
                          y:
                            type: number
                            description: Actual effective longitudinal coordinate (after clamping)
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'The request body is not valid JSON (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/throw:
    post:
      tags: [Action]
      operationId: throwPet
      summary: Throw a pet with an initial velocity
      description: |
        Write an initial velocity to `pets.<id>.throw`. The renderer reacts to its changed counter and
        launches the pet from its current position, without requiring a preceding drag.

        The command shares the manual-throw physics: gravity, wall rebounds, floor friction, monitor
        boundaries, landing squash, optional pet collisions and the final position update.

        Angles use mathematical degrees: `0` points right, `90` up and `-90` down. Positive rotation is
        counterclockwise even though screen Y increases downward. Any finite angle is accepted without
        requiring normalization to 0–360.

        Nominal speed is `power × 1200` px/s, followed by the soft limit
        `3600 × (1 − e^(−v/3600))`:

        | power | Actual initial speed |
        | --- | --- |
        | 1 | approximately 1021 px/s |
        | 3 | approximately 2276 px/s |
        | tending to infinity | approaches 3600 px/s |

        Every valid positive power launches the pet. Unlike a manual drag release, this command does
        not apply the 500 px/s threshold for gently placing the pet down.

        If the user is dragging the pet when the command arrives, the renderer discards it while the
        HTTP response remains `ok: true`, as with `POST /position`.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [angle, power]
              properties:
                angle:
                  type: number
                  description: |
                    Direction, unit **degree**. `0` = straight right, **counterclockwise is positive** (`90` = straight up, `-90` = straight down).
                    Any real number does not need to be normalized by itself.
                  example: 45
                power:
                  type: number
                  exclusiveMinimum: 0
                  description: |
                    Force multiplier, must be > 0. `1.0` corresponds to the 1200 px/s of the soft clamp speed**
                    (The actual initial velocity is about 1021 px/s, see the table above).
                  example: 1
              examples:
                upRight:
                  summary: Throw to the upper right, normal strength
                  value:
                    angle: 45
                    power: 1
                hardLeft:
                  summary: Throw it hard to the left
                  value:
                    angle: 135
                    power: 3
      responses:
        "200":
          description: |
            Always 200 (except 405/400). Failure is expressed via `ok: false`, `reason` may be
             `bad-request` (invalid angle/velocity / `surface` missing or invalid), `pet-required` (not given to pet),
             `unknown-pet`, `generate-error` (configuration unreadable, etc.), `pet-not-displayed` (with `display`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'The request body is not valid JSON (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/lock:
    post:
      tags: [Action]
      operationId: acquireLock
      summary: Occupied lock - lock acquisition/renewal (two-in-one)
      description: |
        issue #122 Item 4 "Independent action/bubble occupation". The third-party plugin needs to perform a linkage (pull the sidebar / jump to capture the mascot /
        When kicking the sidebar), take the lock first, and **exclusively** this pet during this period: no one can move it except the lock holder - 5 action endpoints
        (`/anim`, `/broadcast`, `/position`, `/throw`, `/bubble/clear`) must bring `?lock=<lockId>`,
        The pet's own random animation/autonomous movement/automatic whisper/automatic balance/work status performance all give way.

        **Removing the lock will wake up the sleeping pet first** (lock = third-party takeover): `pets.<id>.sleep` immediately writes back `sleeping: false`,
         The renderer plays "get up" once and then enters the normal animation chain; during the occupation period, `POST /sleep` will return to `locked`.

        **Getting the lock will interrupt the current playback request**: the foreground animation will be paused at that moment, and **unfreezing will not bring it back**
        (Unfreezing is back to the idle/restoration state, which is equivalent to changing the source and pushing it out), so it will indeed not finish playing anymore - the receipt will be reported truthfully
         `cancelled` + `reason: frozen`, instead of always hanging `playing` and letting the caller hanging `?wait=ended` wait in vain
        A timeout. **The lock holder's own playback request is not affected** (the normal sequence is to acquire the lock first and then make a playback request; renewal will not be frozen again).

        **One lock, everything, nothing**, and **third parties do not preempt each other**: first come, first served, if you hit it, return to `locked` + `expiresAt`,
        Use this to decide when to try again. Only **user** can seize it - drag/click the pet, or hide/close it, and the occupation will be revoked immediately
        (`force` form of `POST /lock/release`, reported by renderer).

        **Lock acquisition and renewal are the same endpoint**: `lockId` If it is given, it is renewed, if it is not given, it is new.
        Renewal is a **heartbeat** that the lock holder does every few seconds, and this call is also a detector of "Is my lock still there?"
        ——If lost, it will return `lock-lost` + `cause`, so there is no separate "check lock" endpoint.

        **Truth table** (each cell has a definite conclusion, no guessing for the caller):

        | body | Current Lock | Conclusion |
        | --- | --- | --- |
        | None `lockId` | No lock | New |
        | Without `lockId` | With lock | `locked` + `expiresAt` |
        | Yes `lockId` | Consistent | Renewal (number remains unchanged) |
        | There is `lockId` | There is lock but inconsistent | `lock-lost` / `unknown` |
        | With `lockId` | Without lock | `lock-lost` / `cause` in tombstone |

        **"There is id + currently no lock" will always report an error and will not be revived**: After expiration/release/preemption, use the old number to renew.
        The lock cannot be rebuilt this way - otherwise the fact that "I lost the lock" will be quietly erased, and the lock holder will think that the show is still going on.

        **Bounded**: Memory state + TTL (default 2 minutes, upper limit 30 minutes), the plugin unmount / host will be restarted and all will be invalid——
         A caller crash will not permanently lock the pet. **No timer**: Expiration is lazy, `/state` in the leaf `expiresAt`
        is the only truth by which the renderer **itself** releases itself from quiescence (see `LockLeaf`).

        **When there is no lock, press "With or without `lock`" to triage**: Not with it → Everything is as usual, the behavior of the 5 action endpoints is the same as before the transformation.
        (The most important boundary of issue #122: "When there is no effective linkage occupation, the interface does not change the original behavior of pet"); it is brought but the lock cannot be found
        → `lock-lost` + `cause`, the old lease cannot continue to serve late requests (issue #122 point 4).
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lockId:
                  type: string
                  description:
                    Granted = **Renewal**, Not Granted = **New**. It must be the number that is currently in
                    effect.
                  example: lk-mfh2k1-1
                ttl:
                  type: number
                  default: 120000
                  minimum: 1000
                  maximum: 1800000
                  description: |
                    Occupation time (milliseconds). Default `120000` (2 minutes), range `1000~1800000` (1 second~30 minutes);
                    When renewing, the original one will be used by default.
                    The default setting of 2 minutes is intentional: a linked performance usually lasts from tens of seconds to one or two minutes. ** Even if the caller does not implement renewal,
                    Or if you miss a beat, the lock will not be lost midway** (if it is lost, it will be unfrozen on the spot, which is a phenomenon that is difficult to check).
                    Out of bounds / non-finite number → `ok: false` + `reason: bad-request` (**not clamped**: caller has wrong duration
                    Should know right away rather than get a lock that is shorter or longer than you thought).
                  example: 120000
            examples:
              acquire:
                summary: Get lock (default 2 minutes)
                value: {}
              renew:
                summary: Renewal (extend the same number for another 2 minutes)
                value:
                  lockId: lk-mfh2k1-1
      responses:
        "200":
          description: |
            Always 200 (except 405/400). Failure is expressed via `ok: false`, `reason` may be
             `bad-request` (`ttl` / `lockId` invalid / `surface` missing or invalid), `pet-required` (not given to pet),
             `unknown-pet`, `locked` (with `expiresAt`), `lock-lost` (with `cause`),
             `pet-not-displayed` (with `display` - can't get lock: this pet is not currently showing on the side you want).
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkResponse"
                      - type: object
                        required: [lockId, petId, expiresAt]
                        properties:
                          lockId:
                            type: string
                            description: The number occupied this time. All subsequent operations must bring it (`?lock=`).
                            example: lk-mfh2k1-1
                          petId:
                            type: string
                            description: Which pet is occupied?
                            example: main
                          expiresAt:
                            type: integer
                            format: int64
                            description: When (epoch milliseconds).
                            example: 1755000030000
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'The request body is not valid JSON (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/lock/release:
    post:
      tags: [Action]
      operationId: releaseLock
      summary: Release occupation (lock holder stops work/user takes over)
      description: |
        Remove the current occupation of this pet and everything will be restored immediately (automatic source recovery writes, random chain recovery rolls, renderer unfreeze).

        **Choose one of two forms** (`lockId` and `force` **give exactly one**, give both or neither → `bad-request`):

        - `lockId`: **The lock holder calls it a day**, `cause` is recorded as `released`;
        - `force: true`: ** renderer ** reports "User took over" - called when the user drags/clicks the pet, or hides/closes it,
           `cause` is recorded as `preempted`. Third parties do not need to adjust it.

        Why "user takeover" must be reported by renderer: it is locked in the host memory, and **mouse events cannot reach the host**——renderer is the only one
        The one that knows the user has taken action. If you do not report it, the lock will still be hung after the user drags the pet away, and the pet will continue to be frozen until TTL.
        (issue #122: "When the user actively stops, hides or closes the pet, it should also be able to cancel the linkage to prevent the pet from being permanently locked.")

        **Impotent**: The same returns to `{ "ok": true }` when it is not currently occupied - the intention of "making the lock disappear" has been established in the empty state.
        But when there is a lock and `lockId` **does not match**, an error must be reported (`lock-lost`): you are not allowed to misplace someone else's lock.

        **Does not touch the animation/bubble/position itself**: The currently playing photo will be played and the bubble photo will be set to its own timer. Only "control" is withdrawn here.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |-
                `lockId` and `force` **give exactly one**. Give both or neither → `ok: false` + `reason: bad-request`.
              properties:
                lockId:
                  type: string
                  description: "The lock holder calls it a day: the currently effective occupation number."
                  example: lk-mfh2k1-1
                force:
                  type: boolean
                  description: |
                    **Only strict `true` ** (Loose conventions will take misinformation seriously, at the cost of removing other people's locks - it is better to be strict).
                     The renderer uses it to unconditionally unlock when the user drags/clicks/hides/closes.
                  example: true
            examples:
              byHolder:
                summary: Lock holder calls it a day
                value:
                  lockId: lk-mfh2k1-1
              byUser:
                summary: renderer reports user takeover (drag/click)
                value:
                  force: true
      responses:
        "200":
          description: |
            Always 200 (except 405/400). Failure is expressed via `ok: false`, `reason` may be
             `bad-request` (both are given / neither is given / the type is wrong), `pet-required` (pet is not given),
             `unknown-pet`, `lock-lost` (`lockId` does not match, with `cause`). **Currently no lock is not a failure. **
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'The request body is not valid JSON (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/sleep:
    post:
      tags: [Action]
      operationId: putPetToSleep
      summary:
        Let the desktop pet sleep (the host selects a complete set of sleeping animations and writes them into
        the leaves)
      description: |
        Enter sleep state. host randomly selects one set from the entry `animations.sleep`, and the three sections are listed among the candidates.
        Pick one at random, write it into `pets.<id>.sleep` and respond with three names; the renderer plays "Start (once)→
        Loop (infinite)". Wake up and go `POST /wake`, or triggered by the user clicking on the pet.

        While asleep: host skips automatic sources (whisper/balance/to-do reminders) and rejects manual endpoints (`anim`/`whisper`
        / `chat` / `balance` / `broadcast` / `bubble/clear` / `menu/click`), return when rejected
         `reason: sleeping` and play a line from entry level `sleepRefuseTexts`. **Give way while locked**:
        Calls with `lock=` are not subject to sleep restrictions (the semantics of the lock is to give control to a third party).

        **Impotent**: Keep the original set during sleep, do not replay the animation, and still return to `ok: true` (`changed: false`).
        This entry does not match `animations.sleep` → `ok: false` + `reason: no-sleep-animations`.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
      responses:
        "200":
          description: |
            Always 200 (except 405). Successfully brought `sleeping: true` and the selected `start` / `loop` / `end`;
            Failure is expressed by `ok: false`, `reason` may be `bad-request`, `pet-required`, `unknown-pet`,
             `locked` / `lock-required` / `lock-lost` (occupies validation check), `no-sleep-animations`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/wake:
    post:
      tags: [Action]
      summary: Wake up a sleeping desktop pet
      operationId: wakePet
      description: |
        Exit sleeping state: host writes `pets.<id>.sleep = { sleeping: false }`, and renderer plays "get up (once)"
        Return to random chain. **Impotent**: I returned `ok: true` (`changed: false`) even if I didn’t sleep.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
      responses:
        "200":
          description: |
            Always 200 (except 405). Successfully brought `sleeping: false` and `changed` (whether it really woke up this time);
            Failure is expressed by `ok: false`, `reason` may be `pet-required`, `unknown-pet` or takes up validation check of those three.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/pose:
    get:
      tags: [Action]
      operationId: getPetPose
      summary: Read the latest desktop pet pose
      description: |
        Read the latest desktop pose reported to the host. This endpoint is for desktop pets; a browser
        plugin on the same page can read its local renderer through the `petApi7340` Cordis service:

        ```js
        // Older hosts may not expose the service.
        const svc = ctx.get('petApi7340');
        const pose = svc ? svc.pose('main') : null;
        ```

        No `surface` parameter is required. Coordinates use the same convention as `POST /position`:
        the pet's center, normalized against the bounding rectangle of all desktop screens. Values may
        slightly exceed 0–1 when the user drags the pet beyond a screen edge; they are not clamped.

        The renderer pushes changes with throttling rather than reporting on every poll. Use `updatedAt`
        to judge freshness. Until a desktop renderer has reported after startup/restart, the response is
        `pose-unavailable`.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      responses:
        "200":
          description: |
            Always 200 (except 405). Failure is expressed via `ok: false`, `reason` may be
             `pet-required` (pet is not given), `unknown-pet` (this one is not included in the configuration),
             `pet-not-displayed` (with `display` - it is not displayed on the desktop in configuration, this endpoint has no meaning for it),
             `pose-unavailable` (displayed on the desktop, but no report has been received), `generate-error` (the configuration is unreadable, etc.).
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkResponse"
                      - type: object
                        required: [petId, x, y, facing, updatedAt]
                        properties:
                          petId:
                            type: string
                            description: id of this pet (echoed to facilitate the caller to check the landing point).
                            example: main
                          x:
                            type: number
                            description: Normalized abscissa of pet center (same conventions as `POST /position`).
                            example: 0.42
                          y:
                            type: number
                            description: The normalized vertical coordinate of the pet's center.
                            example: 0.87
                          facing:
                            type: string
                            enum: [left, right]
                            description: Orientation (same word as `facing` of `POST /anim`).
                          updatedAt:
                            type: integer
                            format: int64
                            description:
                              renderer reporting time (epoch milliseconds) - the only basis for judging "how
                              new".
                            example: 1755000000000
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/pose/report:
    post:
      tags: [Action]
      operationId: reportPetPose
      summary: Report a desktop pose (internal)
      description: |
        Internal renderer-to-host channel. Desktop renderers report pose changes from dragging, movement,
        throws, position commands and facing changes. HTTP and `dsh-pet-bridge://` use the same handler.

        The host stores an in-memory snapshot without writing `/state`, so pose reports do not wake all
        pending state polls. The renderer throttles reports to about 2.5 per second with a trailing update
        to preserve the final pose. Third-party consumers normally use `GET /pose` instead.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x, y, facing]
              properties:
                x:
                  type: number
                  description:
                    Normalized abscissa of the pet center (limited number; **accept if out of bounds**, no
                    clamping)
                  example: 0.42
                y:
                  type: number
                  description: Same as above, ordinate
                  example: 0.87
                facing:
                  type: string
                  enum: [left, right]
                  description: Orientation (strictly two literals, case incompatible, namely `bad-request`)
            examples:
              typical:
                summary: A routine report
                value:
                  x: 0.42
                  y: 0.87
                  facing: right
      responses:
        "200":
          description: |
            Always 200 (except 405/400). Failure is expressed via `ok: false`, `reason` may be
             `bad-request` (`x` / `y` non-finite number, `facing` invalid), `pet-required`, `unknown-pet`,
             `generate-error` (configuration unreadable, etc.).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'The request body is not valid JSON (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/playback/{id}:
    get:
      tags: [Action]
      operationId: getPlayback
      summary: Playback receipt - check the true status of a certain playback request
      description: |
        `ok: true` of `POST /anim` **only means that it has been accepted**, but does not mean that the video has been played: asset does not exist, decoding failed,
        If it is pushed out by other animations, there will be no feedback if the response is accepted (historically it was shown as "no response after clicking").
        This interface returns the **real status** of that playback request - the status is determined by the **actually playing end** (browser/desktop rendering process)
        Report to the driver, and the host does not make guesses (the timer for reading the video duration and restarting is wrong: when the loading fails, the playback does not start at all.
        The timer will go to "end of broadcast" as usual).

        **State machine**: `accepted` → `playing` → `ended` / `failed` / `cancelled`.
        The final state **cannot be changed** (the late `ended` will not overwrite `cancelled`), and the report is idempotent repeatedly.

        **Wait (recommended usage)**: The request will **hang** with `wait` + `timeout` (**pair required**):
        When the state enters the `wait` collection, it will return immediately (`matched: true`). If it has not entered the state yet, it will return to the current state.
        (`matched: false`). `wait` supports **comma list** - there are three final states, just wait for `ended` to fail
        **Waiting for timeout in vain**, it is recommended to write `wait=ended,failed,cancelled`. If neither is passed, it will be returned immediately.

        ** lifecycle **: The final state record is retained for about 60 seconds and then cleared, and then the query returns `200` +
         `reason: unknown-playback`. All will fail after the host is restarted.
        (The number is only guaranteed to be unique within one run).

        **Not related to `/state`**: The playback record is **per-caller resource** (only the caller that initiated the playback request cares,
        There is a lifecycle, the number increases with the third-party caller), **does not broadcast globally for 1 second** - otherwise each pet window
        Traffic must be paid for all playback records of all callers.
      parameters:
        - name: id
          in: path
          required: true
          description: The `playbackId` returned by `POST /anim`.
          schema:
            type: string
          example: pb-mfh2k1-1
        - name: wait
          in: query
          required: false
          description: |
            Status to wait for, separated by commas (such as `ended,failed,cancelled`). **Must appear simultaneously with `timeout`**,
            Only fill in one answer `200` + `reason: bad-request`. **returns immediately** when the current state is already in it (no waiting in vain).
            The available values are five status names (`accepted` / `playing` / `ended` / `failed` / `cancelled`).
          schema:
            type: string
          example: ended,failed,cancelled
        - name: timeout
          in: query
          required: false
          description: |
            The maximum number of milliseconds to hang (`0` – `10000`). `0` is valid (next tick returns immediately).
            **Must appear together with `wait`**; non-integer/negative number/exceeding the upper limit will be returned to `200` + `reason: bad-request`.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
          example: 10000
      responses:
        "200":
          description: |
            Playback records. `matched` indicates whether the state in `wait` is reached (it is always `false` when `wait` is not passed).

            The number does not exist or has expired → `200` + `reason: unknown-playback`;
             `wait` / `timeout` parameter is invalid → `200` + `reason: bad-request`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaybackRecord"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/playback/{id}/report:
    post:
      tags: [Action]
      operationId: reportPlayback
      summary: "Report playback status (internal channel: renderer → host )"
      description: |
        **This is the foundation of the receipt. ** The host only knows "accepted", but does not know whether the playback is complete - the animation is played in the browser/desktop rendering process.
        Only that side knows the truth. Therefore, without reporting from this interface, `GET /playback/{id}` will always stop at `accepted`.

        **Third-party caller does not need to call it**, it is sent by the plugin's own renderer once at each of four opportunities:

        | status | Timing |
        | --- | --- |
        | `playing` | The video **does start rendering** (`play()` cashes in, not "sets src") |
        | `ended` | Play to the end |
        | `failed` | Asset not obtained/Decoding failed/Auto play rejected/Mobile system occupied (see `reason`) |
        | `cancelled` | Pushed by **non-playback request** animation (click/drag/whisper/balance/working status/idle recycling) |

         `accepted` is written by the host when accepting, and **does not accept the report from renderer** (400 is reported).
        Reports after the final state are ignored but still return 200 (idempotent) - the late `ended` will not overwrite `cancelled`.

        "Rejected by new playback request" is marked directly by the host when accepting the new playback request, and does not need to be reported by the renderer.
      parameters:
        - name: id
          in: path
          required: true
          description: "`playbackId`。"
          schema:
            type: string
          example: pb-mfh2k1-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [playing, ended, failed, cancelled]
                  description:
                    Only accept these four - `accepted` is in the host acceptance state, and reporting it
                    will return 400.
                reason:
                  type: string
                  description: |
                    Optional reason (free character string). renderer currently used: `asset-load` / `decode-error` /
                     `play-rejected` / `busy` / `superseded` / `frozen` (interrupted by occupied lock freeze).
              examples:
                playing:
                  summary: The broadcast has really started
                  value:
                    status: playing
                ended:
                  summary: Finished
                  value:
                    status: ended
                failed:
                  summary: Asset not obtained
                  value:
                    status: failed
                    reason: asset-load
      responses:
        "200":
          description: |
            Always 200: `{ "ok": true }`. **Status has been updated** and **Impotent Ignore** (reporting after the final state, repeated reporting of the same state)
            It is considered a success - for the reporting party, "this is already the case" is a success.

            The number does not exist or has expired → `200` + `reason: unknown-playback`;
            The state name is invalid (including `accepted`) → `200` + `reason: bad-request`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: "The request body is not valid JSON (`reason: invalid-json`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/attachment:
    get:
      tags: [Assets]
      operationId: getAttachmentImage
      summary: Retrieve a conversation picture by attachment reference
      description: |
        Change `attachmentId` of `messages[].image` in `GET /chat` back to a displayable picture.

        Only accept `sha256:<64 lowercase hex characters>`: the object path is calculated by the host attachment service based on the content hash, and the plugin itself does not spell the path.
        There is no verification of which pet this picture belongs to - id is a content hash and cannot be guessed, and the service only listens to loopback.

        Attachment content is addressable and immutable, so responses can be cached by browsers; standalone mode (no attachment service) is always 404.
      parameters:
        - name: id
          in: query
          required: true
          description: "`attachmentId` (formed as `sha256:…`) in the attachment reference; missing or invalid shape → 400."
          schema:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
      responses:
        "200":
          description:
            Image body. `Content-Type` is determined according to the file header (png / jpeg / gif / webp),
            and the response has a cache header.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: id is missing or has an invalid shape (`text/plain`).
        "404":
          description:
            The attachment does not exist, is not a displayable picture, or there is no attachment service in
            the current mode (`text/plain`).
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/chat:
    get:
      tags: [Action]
      operationId: getChatMemory
      summary: Read recent conversation memory window
      description: |
        Return the pet's most recent rounds of dialogue (**one-time reading, not polling**) for backfilling the history when the dialogue pop-up window is opened.

        The only reader and writer of the memory is the host (persist to disk at `memory.json`). Both the browser and the desktop are just clients.
        Therefore, both ends of the same DSH instance naturally share the same memory. Keep all files and do not delete them.
        Just press `chatMemoryRounds` (default 5 rounds, 1 round = 1 question 1 answer) when responding to intercept the tail;
        If `?rounds=` is passed, it will be intercepted according to the incoming value (only affects this reading and does not change the number of context rounds of subsequent conversations).
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - name: rounds
          in: query
          description:
            The number of rounds read this time (0–200); the configured `chatMemoryRounds` is not passed.
            Invalid value → `bad-request` .
          schema:
            type: integer
            minimum: 0
            maximum: 200
      responses:
        "200":
          description: |
            Recent window. **Failure is also 200** (`{ ok: false, reason }`), distinguished by `ok`:
             `pet-required` (not given to pet), `unknown-pet` (no such pet), `bad-request` (rounds is invalid),
             `generate-error` (read memory/read configuration failed).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, messages, rounds, contextRounds]
                    properties:
                      ok:
                        type: boolean
                        const: true
                      messages:
                        type: array
                        description: Messages arranged in chronological order, up to `rounds * 2` messages
                        items:
                          $ref: "#/components/schemas/ChatMemoryMessage"
                      contextRounds:
                        type: integer
                        minimum: 0
                        description:
                          The number of recent historical rounds actually selected into the next round
                          according to the configured round number and UTF-8 text bytes budget; independent of long-term
                          recall.
                      rounds:
                        type: integer
                        description:
                          The number of rounds that takes effect this time (if `?rounds=` is passed, the
                          incoming value is used, otherwise it comes from the configuration `chatMemoryRounds`)
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Action]
      operationId: sendChat
      summary: Say a word to the specified pet and generate a reply
      description: |
        Generate a reply with historical context, write "question + answer" into memory, and write the reply into `pets.<id>.say`,
        At the same time, the reply text (`text`) will be brought back with the response, and `image` if the generating end chooses to match the image.

        The text is still written into `pets.<id>.say`: other consumers continue to read from `/state`, and the return value is just
        So that the calling party does not have to pull another beat - the two places are the same text, not two truths.

        - Text will be `trim()` , empty text → `{ ok: false, reason: 'bad-request' }` .
        - Text longer than **2000 words** → `{ ok: false, reason: 'bad-request' }`.
        - Model selection: `chatModel` in the entry configuration takes precedence; leaving blank will follow the model of the current conversation.
          When the specified model generation fails, it will automatically fallback to the model of the current conversation and try again.
        - The memory will record the picture reference, picture name and action name of this round (for chat record display), but the historical playback **only contains the text**:
          Picture information and action tags are not included in the context, otherwise the old pictures/old actions will be resent to the model in each round.
        - **Dialogue action linkage** (configuration `chatAnimationEnabled`, enabled by default): When enabled,
           A prompt word is attached to the action list under `animations.categories`, and the model writes it at the end of the reply when it fits the context.
           `[动作:名称]`. After adoption, use the same writeback link as `POST /anim`: write first
           `pets.<id>.anim` (`name` + `playbackId`), then write `pets.<id>.say` (with `anim: false`,
           The bubble will not be linked to the whisper animation, nor will it override the action of the playback request); the mark will be stripped from the bubble body and memory.
          When the model write-only tag has no text, it only performs actions and does not play bubbles. Independent from the map switch: both can take effect at the same time,
          You can also open just one.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 2000
                  description: User message text
                attachment:
                  type: object
                  required: [mediaType, data]
                  description: |
                    Optional: Send a picture (a screenshot of a frame actively triggered by the user) with this round of conversation.

                    - **The behavior when not uploaded is the same as the old version verbatim**; the picture will be recorded in the memory (only the attachment reference will be saved, not the ontology), **will not be entered into the context**,
                       bubble does not display this image either.
                    - bytes are normalized by the host attachment service and persist to disk (content-addressed, same as deduplicate); standalone mode has no attachment service,
                      All uploaded images must be `bad-request`.
                  properties:
                    mediaType:
                      type: string
                      enum: [image/png, image/jpeg, image/webp, image/gif]
                      description:
                        Image media type; if it does not match the decoded true type, it will be rejected by
                        the attachment service.
                    data:
                      type: string
                      description: |
                        Image bytes of canonical base64. **Not accepted** `data:` URL prefix;
                        Contains invalid characters, non-standard filling or exceeds the deployment limit → `bad-request`.
            examples:
              hello:
                summary: Say hello
                value:
                  text: 今天过得怎么样？
              withImage:
                summary: Bring a screenshot to ask a question
                value:
                  text: 屏幕上这个报错是什么？
                  attachment:
                    mediaType: image/jpeg
                    data: <base64 编码的 JPEG 字节>
      responses:
        "200":
          description: |
            Always 200 (except 405). `reason` value: `pet-required` (pet is not given), `unknown-pet` (this pet is not given,
            Or it was deleted while waiting for the memory lock in queue - this one ** does not write memory or bubble **),
             `bad-request` (empty/extremely long message/`surface` missing or invalid/picture shape or base64 invalid/
            Deployment limit exceeded/images not supported in current mode), `provider-missing` (no dialogue service provider available),
             `pet-not-displayed` (with `display`), `generate-error` (generation/IO failed, persist to disk failed with attachment).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SayResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [Action]
      operationId: deleteChatHistory
      summary: Delete the conversation memory of the specified pet
      description: |
        Delete the persist to disk conversation history, **irrevocable**.

        - With `?ts=` (repeatable): delete only these rounds. Two messages in a round share the same `ts`. If one hits, the entire round will be deleted.
        - Without `?ts=`: clear the entire history of this pet.
        - Pets that are not using long-term memory will be deleted and the empty leaves will be removed; if PowerContext is bound, the binding will be retained and the corresponding unsent queue will be cancelled.
        - Local deletion does not recall data that has been sent or is being sent, nor does it delete remote long-term memory.
        - No verification of `surface`: deletion is storage management and does not change the visible state of the renderer.
        - Share the same write queue as the conversation and will not be interleaved with in-progress replies.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - name: ts
          in: query
          required: false
          description: |
            The round timestamp to be deleted (milliseconds, taken from `GET /chat` to `messages[].ts`); multiple times can be passed in repeatedly.
            Any value is not a non-negative integer → `bad-request`. Pass none = clear all.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              format: int64
              minimum: 0
      responses:
        "200":
          description: |
            Always 200 (except 405). Success is `{ ok: true, removed }`; failure is `{ ok: false, reason }`:
             `pet-required` (not given to pet), `unknown-pet` (no such pet), `bad-request` (ts is invalid),
             `generate-error` (failed to read and write memory).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, removed]
                    properties:
                      ok:
                        type: boolean
                        const: true
                      removed:
                        type: integer
                        description: Number of messages actually deleted (one round = 2); 0 when there is no hit
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/powercontext/setup:
    get:
      operationId: getPowerContextSetup
      tags: [Config]
      summary: Read DSH local memory preparation status
      description:
        Returns the memory binding of the model's public parameters, progress, health status and default
        entries, without returning the key. Standalone mode returns available = false.
      responses:
        "200":
          description: Current status; polling does not trigger installation or model calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySetupStatus"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      operationId: configurePowerContextSetup
      tags: [Config]
      summary: Prepare, pause, resume or cancel local memory
      description: |
        Only application/json accepted, cross-site browser request rejected. start asynchronously checks the generated and Embedding models, installs and starts PowerContext.
        The DSH chat model is not modified; memory bindings for default entries are saved when ready. retry retry draft or start saved configuration; stop pause and retain data; cancel cancel current preparation.
        The saved key is only reused if the full endpoint address is the same. The process starts and stops with the DSH plugin, and only one process is allowed to manage the same database.
         models read-only discovers generated or vector models, does not save settings; returns clear matches and candidates with unknown capabilities, actual capabilities still need to be checked by connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySetupRequest"
      responses:
        "200":
          description:
            Accept the operation and return the current status, or return a structured failure; acceptance
            does not mean that the preparation is complete.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MemorySetupStatus"
                  - $ref: "#/components/schemas/MemoryModelDiscovery"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          description: The request was not JSON or came from a cross-site browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /dsh-pet-7340/chat/powercontext:
    get:
      tags: [Action]
      operationId: getPowerContextStatus
      summary: Read pet memory synchronization status
      description: |
        Return synchronization and recall counts/status for the selected pet, without conversation text.
        A captured exchange means PowerContext accepted its Source; extraction and later recall are separate steps.
      parameters:
        - name: pet
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current status or business failure
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PowerContextStatus"
                  - $ref: "#/components/schemas/FailureResponse"
    post:
      tags: [Action]
      operationId: syncPowerContext
      summary: Retry pending pet memory synchronization
      description: |
        Retry up to two pending exchanges using their persisted Source IDs, then return the current status.
        This operation does not directly trigger model extraction. A 409 identity conflict stops automatic
        retries and requires an administrator to resolve the conflicting identity.
      parameters:
        - name: pet
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current status after synchronization or business failure
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PowerContextStatus"
                  - $ref: "#/components/schemas/FailureResponse"

  /dsh-pet-7340/chat/powercontext/memories:
    get:
      tags: [Action]
      operationId: listPetMemories
      summary: View the actual long-term memory of the current pet or the source of a certain memory
      description: |
        When id is not transmitted, up to 10 active atomic memories are listed on each page. Returns the current version of the sources when passing id, up to 3 sources with 2000 character excerpts each.
        Services and Scope are resolved by the host's pet binding and cannot be specified by the client. Returns an empty page when no binding is established; fails explicitly when the service is unavailable.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - name: cursor
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: id
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Memory page, source details or business failure (distinguished by ok)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PetMemoryPage"
                  - $ref: "#/components/schemas/PetMemoryEvidence"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [Action]
      operationId: changePetMemory
      summary: Correct or forget a long-term memory of the current pet
      description: |
        Corrections must carry the content version and status version seen by the user, and refuse to be overwritten if they conflict. Forgetting marks the atomic memory as forgotten and stops long-term recall,
        Original sources, historical versions, or local chat will not be physically deleted. New conversations may still lead to new memories. The success receipt is only returned after confirmation from the remote end.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, id, revision, stateVersion, text]
                  properties:
                    action: { const: correct }
                    id: { type: string, minLength: 1, maxLength: 128 }
                    revision: { type: integer, minimum: 1 }
                    stateVersion: { type: integer, minimum: 0 }
                    text:
                      {
                        type: string,
                        minLength: 1,
                        maxLength: 8192,
                        description: "After removing the leading and trailing
                          blanks, it must not exceed 8192 UTF-8 bytes",
                      }
                - type: object
                  additionalProperties: false
                  required: [action, id, revision, stateVersion]
                  properties:
                    action: { const: forget }
                    id: { type: string, minLength: 1, maxLength: 128 }
                    revision: { type: integer, minimum: 1 }
                    stateVersion: { type: integer, minimum: 0 }
      responses:
        "200":
          description: ok = true means remote confirmation; if failed, ok = false and reason/message will be returned
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok]
                    properties:
                      ok: { const: true }
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/chat/memory:
    get:
      tags: [Action]
      operationId: listOrphanChatMemory
      summary: List remaining conversation history of deleted pets
      description: |
        After a pet is deleted from the configuration, its history in `memory.json` will still be retained; this type of bucketing is neither in `GET /chat`
        The reachable range (where the pet is required to exist) will not disappear on its own. This endpoint lists them, **only gives the number and last time,
        Do not return to text**.
      responses:
        "200":
          description: |-
            Always 200. Success is `{ ok: true, orphans }`; read failure is `{ ok: false, reason: 'generate-error' }`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, orphans]
                    properties:
                      ok:
                        type: boolean
                        const: true
                      orphans:
                        type: array
                        description:
                          Each residue is divided into one bucket; when there is no residue, it is an empty
                          array.
                        items:
                          type: object
                          required: [entry, petId, messages, lastTs]
                          properties:
                            entry:
                              type: string
                              description: Owning entry (asset root)
                            petId:
                              type: string
                            messages:
                              type: integer
                              description: The number of messages remaining in this bucket
                            lastTs:
                              type: integer
                              format: int64
                              description: Timestamp of the last message (milliseconds); 0 if there is no message
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [Action]
      operationId: clearOrphanChatMemory
      summary: clear remaining conversation history of deleted pets
      description:
        Clear all buckets that "no longer exist in the configuration but still exist in the memory" at one
        time, **irreversible**.
      responses:
        "200":
          description: |
            Always 200. Success `{ ok: true, pets, messages }` (the number of deleted pets and the number of messages are both 0 when there are no remaining ones);
            The failure is `{ ok: false, reason: 'generate-error' }`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, pets, messages]
                    properties:
                      ok:
                        type: boolean
                        const: true
                      pets:
                        type: integer
                      messages:
                        type: integer
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/config:
    get:
      tags: [Config]
      operationId: getConfig
      summary: Read the merged resolved configuration
      description: |
        Return to **merged configuration**: built-in default (`assets/config.jsonc`) and user layer
        (`$DSH_HOME/dsh-pet/main-config.jsonc`) The result of deep merging,
        Each entry's fields are filled in (animation pool, weights, physics parameters, job status copy, etc.),
        Consumed directly from the browser/desktop/settings page, **without any verification or fallback**.

        The top-level keys are "entry names" (`main`, `test1`...), not arrays.

        **One entry = one "type"**: animation pool (`animations`), playback weight, persona (`whisperPrompt`),
        Emoji packs (`memes`), models, etc. all belong to entries, and `pets[]` under the entry is its instance - shared by multiple of the same type
        The same pool and asset. Therefore, "What animations can a certain pet play/Which emoticons can it match?" You must first press its id to find the corresponding entry**
        Retrieve: The `main` entry is merged from the built-in default + user layer, and the `pet/<name>-config.json` entry is merged from the category file
        Cover. There is no global animation pool that applies to all pets.
      responses:
        "200":
          description: |
            Finished product configuration (the top level is the entry name → the entry configuration object).

            The failure to read the configuration (installation damage / IO) is the business conclusion: the same is `200` +
             `{ "ok": false, "reason": "generate-error", "message": "..." }`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PetConfigEntry"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    put:
      tags: [Config]
      operationId: saveConfig
      summary: Save user layer configuration
      description: |
        Perform **whitelist reconstruction** on the user layer and then write to disk, and then return the saved resolved configuration (the same as `GET /config`).

        There are a few things you must know:

        - **Only whitelist fields will be retained**: `pets[]` / `id` / `name` / `size` / `sizePercent` / `balanceEnabled` /
           `whisperEnabled` / `workStatusEnabled` / `fixedEnabled` / `display` / `position`, and the top layer
           `notificationsEnabled` / `clickSoundEnabled` / `whisperImageEnabled` / `chatImageEnabled` /
           `chatAnimationEnabled` / `confineToScreen` / `trayEnabled` / `voiceEnabled` / `voiceName` / `voiceWhisperEnabled` /
           `voiceTodoEnabled`/`voiceNotifyEnabled`/`physics`/`font`/`whisperModel`/`chatModel`/`chatMemoryRounds`/
           `chatImageLimit`/`chatMemory`.
          The remaining fields will use the original values in the user file on disk (retained through transparent transmission), so the settings page is saved
          **Won’t erase** your handwritten fine-tuning configuration (`whisperPrompt` / `memes` / `eventsRefreshSec`, etc.).
          The whitelist field is only considered whitelisted when the request body is actually passed: if it is not passed, it will be passed through and will not be erased to the default value.
        - When the user layer file ** exists but cannot be parsed even by JSONC ** (really damaged), the default is ** not to write to the disk first **,
          Return `200` + `reason: user-config-unparsable` (with `needConfirm`, `userFile`) and let the caller confirm——
          Because whitelist reconstruction will completely discard the remaining content in the file and silence it. Add `?force=1` when confirming rebuilding.
        - After successful saving, the host will **asynchronously** restart the desktop Helper (`display` / `size`, etc. may change),
          Does not block responses.
      parameters:
        - name: force
          in: query
          required: false
          description:
            Skip the "user layer cannot be parsed" pre-check when setting `1`, forcibly rebuild and write to
            disk
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveConfigRequest"
            examples:
              singlePet:
                summary: Save a pet
                value:
                  pets:
                    - id: main
                      name: 蓝毛小女仆
                      size: 462
                      balanceEnabled: true
                      whisperEnabled: true
                      workStatusEnabled: true
                      fixedEnabled: false
                      display: both
                      position:
                        corner: bottom-right
                        marginX: 24
                        marginY: 24
                  notificationsEnabled: true
                  whisperImageEnabled: true
                  chatImageEnabled: true
      responses:
        "200":
          description: |
            Save successfully → the resolved configuration after saving.

            **Business failure** → `{ "ok": false, "reason": "...", "message": "..." }`, `reason` value
             `bad-request` (invalid pet configuration), `user-config-unparsable` (with `needConfirm`, `userFile`),
             `generate-error` (Failed to write to disk, details are only entered in the log).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PetConfigEntry"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: "The request body is not valid JSON (`reason: invalid-json`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [Config]
      operationId: syncConfigFromDefault
      summary: Overriding user-level configuration with built-in defaults
      description: |
        Write the entire **original text (including comments)** of `assets/config.jsonc` in the package into the user configuration file.
        This is not only a "restore to default", but also leaves the user with a complete configuration that can be edited directly.
        No need to make a copy from the package yourself.

        After writing to the disk, asynchronously restart the desktop Helper and return the new resolved configuration.
      responses:
        "200":
          description: |
            Synchronization successful → new resolved configuration.

            **Business failure** → `200` + `{ "ok": false, "reason": "generate-error", "message": "..." }`
            (Default file is missing/user directory is not writable: fail explicitly, never leave half the configuration file silently).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PetConfigEntry"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/pet-display:
    post:
      tags: [Config]
      operationId: setPetDisplay
      summary: Change the display position of a single pet
      description: |
        Press the pet id to change its `display`, and return the modified resolved configuration (the same as `GET /config`).

        This is the **single shortcut form** of `PUT /config`: The caller does not need to return the entire `pets[]` (that would easily hurt the same layer by mistake)
        For other pets, you have to decide which level to write on your own). It is used for the "Show Location" in the right-click menu on both the desktop and the browser.

        **The layer ownership is checked back by the host, and the caller should not pass it**: `id` is **globally unique** after the merger (`mergePet` will be skipped)
        (Repeat example), the host uses `findPetInstance` to locate and determines which file to write according to the entry ownership - `main` entry is written
         `$DSH_HOME/dsh-pet/main-config.jsonc`, file pet write `pet/<prefix>-config.json` (`.jsonc` is also supported).

        The writing semantics are consistent with `PUT /config`: whitelist reconstruction + disk original value transparent transmission (handwritten fine-tuned fields will not be erased).
        After writing to the disk, restart the desktop Helper **asynchronously** without blocking the response - the response may not be delivered in time (the initiator is often
        The desktop process Helper that is about to be replaced), the caller can be processed as fire-and-forget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, display]
              properties:
                id:
                  type: string
                  description: Pet instance id (globally unique after merging)
                display:
                  type: string
                  enum: [web, desktop, both, none]
                  description: |
                    Target display location: `web` only web page / `desktop` only desktop / `both` both / `none` are not displayed.
                    After selecting `none`, both ends of this pet will be invisible. The restored entry point is the "Display Position" drop-down box on the settings page.
            examples:
              toWeb:
                summary: Remove from desktop and keep on web page
                value:
                  id: main
                  display: web
      responses:
        "200":
          description: |
            **Change successful** → modified resolved configuration (same as `GET /config`);
            **Business failure** → `{ ok: false, reason, message }` (Leave it to the business conclusion, no need to express it with 400/404,
            Otherwise, the caller will regard the business conclusion as a transport layer failure).

             `reason` value: `pet-required` (missing `id`/empty string/all blank), `bad-request` (`display`
            Not included in the enumeration / pet configuration at this level is invalid), `unknown-pet` (this pet cannot be found, including id and other entries
            Duplicate and skipped during merging), `generate-error` (configuration read failure/disk write failure/entry configuration
            File not found).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PetConfigEntry"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: "The request body is not valid JSON (`reason: invalid-json`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/pet-config:
    post:
      tags: [Config]
      operationId: savePetLayer
      summary: Write back all instances of it by type
      description: |
        Write the entire `pets[]` of a "type" back to its own configuration file, and return the written resolved configuration
        (Same copy as `GET /config`).

        The gap between the two existing write endpoints is filled: `PUT /config` write-only user master configuration, `POST /pet-display`
        Only modify a single `display`. This article is written as "entry": `entry` is the file name of `pet/<name>-config.json`
        Prefix (= asset root), the target file is located by host, the caller does not pass the path.

        Things you must know:

        - **Whole paragraph replacement**: `pets` must be **all instances** of this entry. Missing one is equivalent to deleting it.
        - **Whitelist Reconstruction + Transparent Transmission Retention**: Only instances `id` / `name` / `size` / `sizePercent` / `balanceEnabled` /
           `whisperEnabled` / `workStatusEnabled` / `fixedEnabled` / `display` / `position` / `whisperPrompt`;
          The `animations` / `animationWeights` / `whisperPrompt` / `memes` at the top level of the file are left intact.
        - **Global fields are not accepted**: `notificationsEnabled` / `physics` / `font` / `whisperModel`, etc. will be uploaded immediately
          This layer is not written either - global fields only belong to `main` and are written by `PUT /config`.
        - **`entry: "main"` is rejected**: The main layer also has global fields, and must go to `PUT /config`.
        - **Comments will be lost when writing back**: `//` comments in `pet/*.jsonc` will be erased to pure JSON (the same as `POST /pet-display`
          consistent).
        - ** id is globally unique across entries**: Instances id with the same name as other types will be rejected before writing to the disk (`bad-request`).
          Otherwise, reading will be silently skipped due to duplication.
        - After writing to the disk, the desktop Helper is also restarted **asynchronously** without blocking the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry, pets]
              properties:
                entry:
                  type: string
                  description: |
                    Entry name = filename prefix of `pet/<name>-config.json(c)` = asset root.
                    `main` is not accepted, nor can it contain invalid characters such as path separators.
                pets:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/PetEntry"
            examples:
              oneInstance:
                summary: Change the glm type to a web instance
                value:
                  entry: glm
                  pets:
                    - id: glm1
                      name: GLM 龙娘
                      size: 360
                      balanceEnabled: false
                      whisperEnabled: true
                      workStatusEnabled: true
                      fixedEnabled: false
                      display: web
                      position:
                        corner: top-right
                        marginX: 24
                        marginY: 100
      responses:
        "200":
          description: |
            **Write back successfully** → the written resolved configuration (the same as `GET /config`);
            **Business failure** → `{ ok: false, reason, message }` (Business conclusion does not need to be expressed with 400/404).

             `reason` value: `bad-request` (missing `entry` / `entry` is invalid / `entry` is `main` /
             `pets` is empty or the field is invalid / id conflicts with other categories), `unknown-entry` (this category has no configuration file),
             `generate-error` (failed to read configuration or write disk).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PetConfigEntry"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: "The request body is not valid JSON (`reason: invalid-json`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/config/meta:
    get:
      tags: [Config]
      operationId: getConfigMeta
      summary: Configuration file path and storage location list
      description: |
        The display data source of the "Advanced Configuration" and "Unmount and Storage" sections of the settings page:
        Tell you where the configuration and various data are located, where the log files are, and which profile should be used for the unmount command.
      responses:
        "200":
          description:
            Path list. This endpoint has a read-only path and environment and does not make business
            judgments, so there is no failure entity.
          content:
            application/json:
              schema:
                type: object
                required: [user, default, animations, logs, storage, profile]
                properties:
                  user:
                    type: string
                    description: Absolute path to user layer configuration file
                  default:
                    type: string
                    description: The built-in default configuration absolute path in the package
                  animations:
                    type: string
                    description: Absolute path of user animation asset root directory
                  todos:
                    type: string
                    description: |
                      Absolute path of pending data file (`$DSH_HOME/dsh-pet/todos.json`).
                      A piece of user-level data, regardless of pets: the list text, expiration time and completion status are all here. Deletion equals clear to-do.
                  logs:
                    type: string
                    description: |
                      Unified log file absolute path (`$DSH_HOME/dsh-pet/logs.txt`).
                      The desktop version DSH does not have a console, and all plugin running logs fall on this file.
                      The upper limit of a single file is 1 MB. After it is full, only the latest 512 KB will be retained.
                  storage:
                    type: array
                    description:
                      All persist to disk locations (user data/Electron runtime/desktop cache/download
                      cache/plugin body)
                    items:
                      $ref: "#/components/schemas/StorageEntry"
                  profile:
                    type: string
                    description: |
                      DSH profile name, used for concatenate unmount command
                       `dsh plugin --profile <name> remove dsh-pet`. If it cannot be deduced, it will be an empty string.

  /dsh-pet-7340/models:
    get:
      tags: [Config]
      operationId: listModels
      summary: List optional service providers and models
      description: |
        The data source of the "AI Model" drop-down box on the settings page is from the same origin as DSH's own model selector——
        All come from the host `llm` service: `listProviders()` is a registered real-time service provider route,
         `listModels(provider)` is the model under this route.

        - read-only, no side effect.
        - A certain service provider column model failed (adapter not supported / network problem) only made `models` an empty array,
          **without weighing down the entire list**.
        - When neither service provider route is registered, fallback to `listConfigurableProviders()`
          (The adapter declares a configurable route) so that the drop-down box is not left empty.
        - When `name` of the service provider/model is missing, the fallback is `id`.
      responses:
        "200":
          description: |
            List of service providers and models. If the list cannot be obtained, the dependency is not available (the host does not provide the llm adapter / all column models failed),
            The same is `200` + `{ "ok": false, "reason": "generate-error", "message": "..." }`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [providers]
                    properties:
                      providers:
                        type: array
                        items:
                          $ref: "#/components/schemas/Provider"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/reload:
    post:
      tags: [Action]
      operationId: reload
      summary: Reload desktop (restart Helper)
      description: |
        Restart the desktop Helper process, and all desktop pet windows will be rebuilt according to the latest configuration.
        Take the same restart path as saving the configuration (serial queue + wait for the old process to actually exit and start a new one),
        Therefore, changes in the number of pets / `display` / `size` also take effect.

        **Note**: The initiator is usually the Helper that is about to be restarted. This response is not guaranteed to be delivered.
        Therefore, the implementation does not wait for the restart to complete and returns `200` immediately.
      responses:
        "200":
          description: Already queued for restart
          content:
            application/json:
              schema:
                type: object
                required: [reloading]
                properties:
                  reloading:
                    type: boolean
                    const: true
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/quit:
    get:
      tags: [Action]
      operationId: probeQuit
      summary: Detect whether the host is allowed to exit
      description: |
        System tray "exit" capability detection (issue #178). Only when the `shutdownApp` service is provided in standalone mode
         `canQuit` is `true`; the desktop mode in DSH does not have this capability, it returns to `false`, and the system tray menu does not display the exit item.
        Capabilities are determined upon request and are not cached.
      responses:
        "200":
          description: Ability detection results
          content:
            application/json:
              schema:
                type: object
                required: [canQuit]
                properties:
                  canQuit:
                    type: boolean
              example:
                canQuit: false
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [Action]
      operationId: quitHost
      summary: Request host to exit (system tray "exit")
      description: |
        Return to `200` immediately, and then asynchronously call the host's `shutdownApp` cleanup (stop Helper + shut down the service + exit).
        The initiator is usually Helper, which is about to be stopped. **The response is not guaranteed to be delivered**.

         When the host does not provide exit capability, it will also return `200`, but `ok:false, reason:"unsupported"`
        (Action endpoint conventions: Unsupported is not a protocol layer error, consistent with `POST /pet-display`).
      responses:
        "200":
          description: The withdrawal request has been accepted, or it is clearly informed that it is not supported.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  reason:
                    type: string
                    enum: [unsupported]
                  message:
                    type: string
              example:
                ok: true
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/thumb/{petId}/{file}:
    get:
      tags: [Assets]
      operationId: getAnimation
      summary: Get pet animation asset
      description: |
        Determine asset ownership according to "Whether there is an independent asset directory `pet/<petId>-animation/` for this pet":

        - **Exists** (pet pack pet): Only check this directory, if not found, `404` will report an explicit error - **Never mix** other assets.
        - **Does not exist** (all main configured pets, including any number added by the user): Take the main asset chain——
          The user directory `main-animation/<webm|mov>` takes priority, followed by `assets/<webm|mov>` in the package.
          Regardless of the number of pets, multiple pets can be shared.

         `petId` is an identifier (i.e. `<name>` in `<name>-animation`), not a path fragment:
        Contains the delimiter / reserved character, which is `400`, earlier than any path concatenate determination. The valid name (including Chinese) is as usual.
      parameters:
        - name: petId
          in: path
          required: true
          description: asset root identifier (pet pack pet is `<name>`, main pet is `main`)
          schema:
            type: string
        - name: file
          in: path
          required: true
          description: Animation file name (can contain sub-path). **Extension must be `.webm` or `.mov` **
          schema:
            type: string
      responses:
        "200":
          description: Animation file
          content:
            video/webm:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        "400":
          description: |
            `petId` contains invalid character; or the extension is not `.webm` / `.mov`
            (`unsupported animation format`); or the number of path segments is incorrect.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: "asset does not exist (`dsh-pet: asset not found`)"
          content:
            text/plain:
              schema:
                type: string

  /dsh-pet-7340/voice/hear:
    post:
      tags: [Voice]
      operationId: transcribeVoice
      summary: Recognize a recording into text
      description: |
        The inverse of `/voice/speak`: audio in, text out.

        Recognition comes from the host speech service. If the voice-input plugin is not enabled, return `unsupported`, not a recognition failure.

        Supply base64-encoded 16 kHz mono PCM16 WAV in `audio`. Other containers (MP3/WebM/OGG) and sample rates are rejected by the host recognizer; format failures return `generate-error` with its explanation.

        Decoded audio must be at most 768 KiB, about 24 seconds. Base64 expands it by roughly one third against the 1 MiB request-body limit. Recognition processes the full clip without streaming.

        Invalid parameters return `bad-request`, unavailable capability returns `unsupported`, and recognizer errors return `generate-error`. These are HTTP 200 with `{ ok: false, reason, message }`; invalid JSON returns 400 and unsupported methods return 405.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audio]
              properties:
                audio:
                  type: string
                  description: 16 kHz/mono/PCM16 WAV of base64; decoded upper limit 768 KiB.
                language:
                  type: string
                  description: Language prompt, such as `zh` / `en`; the default is determined by the host identifier.
      responses:
        "200":
          description: |
            `{ ok: true, text }` when successful; `{ ok: false, reason, message }` when failed.
             reason value `bad-request` (invalid parameter)/`unsupported` (no recognizer available for host)/
             `generate-error` (Recognizer failed or timed out).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  text:
                    type: string
                    description: Appears only when successful.
                  reason:
                    type: string
                    description: Appears only on failure.
                  message:
                    type: string
                    description: Appears only on failure.
        "400":
          description: The request body is not valid JSON.
        "405":
          description: Method is not POST.

  /dsh-pet-7340/voice/speak:
    post:
      tags: [Voice]
      operationId: synthesizeVoice
      summary: synthesize a piece of speech
      description: |
        Synthesize a Chinese text into mp3, and return the file body directly when successful.

        - ** The synthesis source can be overwritten by third parties**: The host plugin can be served by Cordis via `petApi7340.voice.register`
           Register your own implementation; after registering, this endpoint will use this implementation, and if not registering, it will use the built-in implementation. Both sides return mp3,
           There is no need to distinguish caller.
        - During the overwriting period, the `voice` parameters do not take effect (the timbre is determined by the third-party implementation), but the verification conventions remain unchanged:
          Invalid values are still rejected as `bad-request`.
        - The third-party implementation must return mp3 bytes; browsers that return other formats cannot play them, and empty bytes are processed as `generate-error`.
        - The same "source + timbre + speaking speed + text" will only be synthesized once, and it will no longer be connected to the Internet when it hits the cache; the source is the built-in implementation
          or third party id , so old audio won't be hit after switching implementations.
        - Synthesis is executed serially, with up to 3 queued at the same time; if exceeded, `voice-busy` is returned, and the caller can try again later.
        - Parameter problems, queue fullness, and upstream failure are all business failures: HTTP 200 + `{ ok: false, reason, message }`.
        Only if the request body is not valid JSON, it will be 400, and if the method is incorrect, it will be 405.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  description:
                    The text to be synthesized; trim must not be empty after, and the maximum length is 500
                    UTF-16 characters.
                  maxLength: 500
                voice:
                  type: string
                  description: Tone id must come from `/voice/voices`; the default is `zh-CN-XiaoxiaoNeural`.
                rate:
                  type: string
                  description:
                    prosody speech rate expression, such as `+0%` / `-10%`; allowed -50%..+100%, default
                    `+0%`.
                  pattern: ^[+-][0-9]{1,3}%$
      responses:
        "200":
          description: |
            mp3 audio on success; JSON `{ ok: false, reason, message }` on failure,
             The value of reason is `bad-request` (invalid parameter)/`voice-busy` (queue is full)/`generate-error` (upstream failure or timeout).
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                required: [ok, reason, message]
                properties:
                  ok:
                    type: boolean
                    const: false
                  reason:
                    type: string
                  message:
                    type: string
        "400":
          description: The request body is not valid JSON.
        "405":
          description: Method is not POST.

  /dsh-pet-7340/voice/voices:
    get:
      tags: [Voice]
      operationId: getVoices
      summary: List available sounds
      description:
        Same origin as the whitelist of `/voice/speak`; the front end renders the tone selector accordingly,
        do not hardcode id.
      responses:
        "200":
          description: Voice list.
          content:
            application/json:
              schema:
                type: object
                required: [ok, voices]
                properties:
                  ok:
                    type: boolean
                    const: true
                  voices:
                    type: array
                    items:
                      type: object
                      required: [id, name, tag, default]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        tag:
                          type: string
                        default:
                          type: boolean
        "405":
          description: Method is not GET.

  /dsh-pet-7340/character:
    get:
      tags: [Assets]
      operationId: getCharacter
      summary: Obtain the character reference map (align the character when a third-party self-generates the map)
      description: |
        Press asset to return a character reference picture (usually three views), so that the character can be used consistently when making drawings for third-party plugins.

        **dsh-pet does not generate a graph model**: This endpoint only delivers "What is a character like this", drawings, models, key and
        The billing is all done by the caller. Therefore, it does not require image service provider configuration and does not consume host credits.

        Search order: `pet/<asset-root>-character.<ext>` (pet pack comes with it) → inside the package
         `assets/<asset-root>-character.<ext>` (released with the package). Extension by png / jpg / jpeg / webp / gif
        Detect in sequence and return the first one that hits; the extension is determined at the same time `content-type`.

        The parameter name is `root` instead of `pet`: what you want is the asset root (directory prefix), not the other endpoint `PetIdQuery.pet`
        The pet instance id . Same conventions as `/logo?root=` and `/pet-avatar?root=`.
      parameters:
        - name: root
          in: query
          required: true
          description: |
            asset root (file name prefix of `pet/<name>-config.json(c)`) - **required**, no default value:
            Guessing a default value will cause the caller to silently get another pet's face. Contains invalid characters such as path separators → 400.
          schema:
            type: string
          example: main
      responses:
        "200":
          description: |-
            Image bytes; `content-type` determined by the extension hit.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "400":
          description: "`root` is missing, or `root` contains invalid characters such as path separators (`text/plain`)."
        "404":
          description:
            "The asset root does not have a character reference image (`text/plain`, text `dsh-pet: character not
            found`)."

  /dsh-pet-7340/logo:
    get:
      tags: [Assets]
      operationId: getLogo
      summary: Get pet avatar (default is plugin logo)
      description: |
        Return `assets/logo.png` in the package without parameters. Only this one file is allowed - `assets/`. There is also a configuration file under the root.
        It is not opened as a static directory, so the path does not accept extra segments (an extra segment is 400).

        When bringing `root=<asset-root>`, first look for the avatar uploaded by pet pack (`pet/<asset-root>-avatar.<ext>`,
        The extension is determined by the file header, which can be png / jpg / webp / gif); if it has not been uploaded, it will fall back to logo in the package.
         `root=main` (built-in entry) **does not check** the custom file and always returns logo in the package.

        The parameter name is `root` instead of `pet`: what is needed here is the asset root (directory prefix, such as `baimao`), not other endpoints
         `PetIdQuery.pet` is a pet instance of id (`pets[].id`, like `main`). Different synonyms of the same name will cause people to press the existing `pet`
        After the semantic call, the default image is obtained silently.

         `v` is an arbitrary cache breaking parameter and is not parsed by host.
      parameters:
        - name: root
          in: query
          required: false
          description: |
            asset root (file name prefix of `pet/<name>-config.json(c)`). Default or `main` → logo in the return packet.
            Contains invalid characters such as path separators → 400.
          schema:
            type: string
          example: baimao
        - name: v
          in: query
          required: false
          description:
            The version number used for cache failure (change it when the panel is opened/refreshed/uploaded
            successfully), ignored by the host.
          schema:
            type: string
      responses:
        "200":
          description: |-
            Picture. The default is PNG; `root` is based on the actual file type when hitting the custom avatar.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "400":
          description:
            The path has extra segments, or `root` contains invalid characters such as path delimiters
            (`text/plain`).
        "404":
          description: There is no logo in the package (the installation is damaged, `text/plain`).

  /dsh-pet-7340/pet-avatar:
    post:
      tags: [Assets]
      operationId: uploadPetAvatar
      summary: Upload/overwrite the avatar of pet pack
      description: |
        Write a picture as `pet/<asset-root>-avatar.<ext>`, overwriting the old avatar of the same asset root.
        The extension is determined by the magic number in the file header (png / jpg / webp / gif). Do not trust the file name; the old one will be cleared when changing the format.
        For other extensions, when multiple copies are read concurrently, the latest one will be taken based on the modification time.

        Why use base64 instead of binary naked stream: The host request body is decoded according to utf8, and the binary is destroyed at the decoding point.

        Things you must know:

        - **Only belongs to pet pack **: `root=main` (built-in entry) is directly rejected - `pet/` directory does not accept built-in avatars.
          The built-in plugin always defaults to logo.
        - **Upper limit 768 KiB (after decoding)**: The upper limit of the request body is 1 MiB, base64 expands by 4/3, so the original image is capped at about 750 KB;
          The settings page will first shrink the image to the long side 512 before uploading.
        - **Only verify "file avatar image + within budget"**: no cropping, no re-encoding, size and quality guaranteed by caller.
        - **Take effect immediately** after persisting to disk: It is not a configuration field, does not require `PUT /config`, and does not restart the desktop Helper.
        - All instances of the same asset root share one avatar (the file is named according to the asset root, not the instance id).
      parameters:
        - name: root
          in: query
          required: true
          description: |-
            asset root (file name prefix of `pet/<name>-config.json(c)`) - **required**, and cannot be `main`.
          schema:
            type: string
          example: baimao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base64]
              properties:
                base64:
                  type: string
                  description: |
                    Specification base64 without `data:` prefix. Non-canonical input will be rejected (the same conventions as `/chat`'s attachment verification),
                    Additional bytes will not be silently decoded.
            examples:
              upload:
                summary: Change baimao to PNG
                value:
                  base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
      responses:
        "200":
          description: |
            **Success** → `{ ok: true }`;
            **Business failure** → `{ ok: false, reason, message }` (Business conclusion does not need to be expressed with 400/404).

             `reason` value: `bad-request` (missing `root` / `root` is invalid / `root` is `main` /
             `base64` is missing or non-standard), `unsupported` (the file header is not PNG / JPEG / WebP / GIF),
             `internal-error` (disk writing failed).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'The request body is not valid JSON: `400` + `{"ok":false,"reason":"invalid-json"}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "413":
          description: 'More than 768 KiB after decoding: `413` + `{"ok":false,"reason":"payload-too-large"}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/sound/{file}:
    get:
      tags: [Assets]
      operationId: getSound
      summary: Get click sound effect file
      description:
        Reading from packet `assets/sound/` (flat structure, **no** petId segment); currently only
        `click-duck.wav`.
      parameters:
        - $ref: "#/components/parameters/AssetFile"
      responses:
        "200":
          description: Sound effect file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: "Sound effect does not exist (`dsh-pet: sound not found`)"
          content:
            text/plain:
              schema:
                type: string

  /dsh-pet-7340/font/{file}:
    get:
      tags: [Assets]
      operationId: getFont
      summary: Get font files
      description: Reading from packet `assets/fonts/` (flat structure, **no** petId segment).
      parameters:
        - $ref: "#/components/parameters/AssetFile"
      responses:
        "200":
          description: Font file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: "Font does not exist (`dsh-pet: font not found`)"
          content:
            text/plain:
              schema:
                type: string

  /dsh-pet-7340/pic/{file}:
    get:
      tags: [Assets]
      operationId: getPic
      summary: Get notification icon/meme
      description: |
        Static image, two forms:

        - `/dsh-pet-7340/pic/<name>.png` → **In package** `assets/pic/` (square png, used for system notification icon).
        - `/dsh-pet-7340/pic/memes/<asset-root>/<name>.png` → Meme image (whisper/picture for conversation pictures),
          Determine **asset ownership** according to the asset root, which has the same semantics as animation (`/thumb`):
          1. `pet/<asset-root>-memes/` exists (the category comes with its own meme): **Only check this directory**, if not found, `404` will report an explicit error.
             **Never fallback **Other directories;
          2. Does not exist: User directory `$DSH_HOME/dsh-pet/memes/` takes priority, followed by `assets/memes/` in the package (merge file by file,
             Isomorphic to the main asset chain of `main-animation/<ext> → bundled assets/<ext>`).

           asset root = entry key for this pet (`assetRoot`: the main configuration pet is `main`, and the file pet is the configuration file prefix).
          The old two-segment form `/dsh-pet-7340/pic/memes/<name>.png` is still available and is equivalent to the fallback chain of the asset root `main`
          (Clients that have not been upgraded can still get the emoticons in the package).

           `asset-root` is an identifier (not a path fragment): the delimiter/reserved character is `400`, which precedes any path concatenate determination.
          The meme name is the file name (excluding subdirectories), and both share the same anti-traversal check.
      parameters:
        - $ref: "#/components/parameters/AssetFile"
      responses:
        "200":
          description: Picture file
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "400":
          description: "The asset root contains invalid character (`dsh-pet: invalid asset root`)"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: "The picture does not exist (`dsh-pet: pic not found`)"
          content:
            text/plain:
              schema:
                type: string

  /dsh-pet-7340/menu/item:
    post:
      tags: [Action]
      operationId: registerMenuItems
      summary: register third-party right-click menu item (the owner menu item is fully covered)
      description: |
        Use this when other plugins want to add their own entry point to the desktop pet right-click menu. All third-party menu items are collected in **"More"**
        Under the first-level menu: `label` is directly tiled when it is the only one among all third-party items (`更多 / 弹弓`); when `label` has the same name,
        Each `owner` occupies a submenu (`更多 / owner / label`) under "More", which is used to distinguish items with the same name.
         The host's own menu items are fixed and do not participate in duplicate name determination.

        ** register = overall coverage**: all current menu items of this owner = this time `labels` (items not in the list are triggered together with
        tags are discarded together). Each call uses a complete list describing "what I have now", so no zombie items are left behind, caller
        Don’t worry about what was registered last time; just use `DELETE /menu/item?owner=` to clear it if you don’t want to keep it.

        ** `owner` has two identities**: it is both a partition key (by which the event stream is isolated) and a first-level group name (directly displayed to the user).
        Therefore Chinese is allowed. The menu copywriting is the responsibility of the register party, and the host **does not deduplicate, number or source annotation** - both plugins are called
        "Slingshot" displays two "Slingshots", and clicked owner for each.

        Limit: `owner` ≤ 64 characters, `label` ≤ 32 characters (all characters after trim are not empty, control characters are prohibited), each owner ≤ 20 items,
        Global ≤ 32 owner . The data is in the process memory and will be cleared when DSH is restarted (it should be re-registered when the plugin is reloaded).

         Immediately after registering, write `/state` and `sections.menu`, and the browser and desktop will get it in the next tick - **No need to restart the desktop
         Helper**.

        **Business failure is still 200** (same conventions as `/anim` and `/lock`): See `ok` and `reason` to explain which one it is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, labels]
              properties:
                owner:
                  type: string
                  maxLength: 64
                  description: Partition key + first-level group name. Chinese is allowed.
                  example: 小游戏
                labels:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description:
                    Menu item copy (duplicate items within the same owner are automatically deduplicated and
                    the position where they first appear is retained).
                  items:
                    type: string
                    maxLength: 32
                  example: [弹弓, 钓鱼]
      responses:
        "200":
          description: "Success `{ ok: true }`; Failure `{ ok: false, reason, message }`"
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  reason:
                    type: string
                    description:
                      "Reason for failure: `bad-request` / `invalid-owner` / `invalid-labels` / `invalid-label`
                      / `too-many-items` / `too-many-owners`"
                  message:
                    type: string
        "400":
          description: The request body is not valid JSON (`invalid JSON body`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "405":
          description: Method not allowed (only POST / DELETE accepted)
    delete:
      tags: [Action]
      operationId: clearMenuOwner
      summary: Clear all menu items of a certain owner
      description: |
        Discard the entire menu item of owner (including the trigger mark that has not been removed). **Impotent**: owner does not exist →
         `removed: 0`, it is still considered successful, and you will not see the error when you try to log out again.

        After clearing it, the long polling on owner will be woken up. owner → `{ ok:false, reason:
        "unknown-owner" }` cannot be found when waking up. The caller can see it and register again. Other owner are not affected.
      parameters:
        - name: owner
          in: query
          required: true
          description: owner to be cleared (URL encoding, Chinese must be `encodeURIComponent`)
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: "Success `{ ok: true, removed: 2 }`; Failure `{ ok: false, reason, message }`"
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  removed:
                    type: integer
                    description: Number of deleted menu items (0 when owner does not exist)
                  reason:
                    type: string
                    description: "Failure reason: `invalid-owner`"
                  message:
                    type: string
        "405":
          description: Method not allowed (only POST / DELETE accepted)

  /dsh-pet-7340/menu/events:
    get:
      tags: [State]
      operationId: pollMenuEvents
      summary: Query the status of third-party menu items being clicked (read and consume)
      description: |
        Return the **full mapping** `label → petId | null` of owner (null = has not been clicked), and mark these
        All clear. **Consumption upon return, no reinvestment**: The trigger that crashes before processing will be lost. This is an intentional trade-off.
        (The user clicked the menu = one-time trigger, not the message queue).

        Connecting points to the same item twice is only counted once (latch semantics, no counting, no sorting); `petId` indicates which pet clicked——
        When opened multiple times, the same menu item may be clicked on different pets.

         `wait` will be polled for a long time: it will hang when there is no trigger at the moment, and it will return when it is clicked/timed out/the owner is re-registered.
        After the timeout, the full `null` mapping is returned as usual (not an error).

        **One owner should have only one consumer**: two processes will check each other at the same time (whoever returns first gets the mark).
      parameters:
        - name: owner
          in: query
          required: true
          description: owner used when registering (URL encoding, Chinese must be `encodeURIComponent`)
          schema:
            type: string
        - name: wait
          in: query
          required: false
          description: Long polling milliseconds; default 0 = return immediately
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        "200":
          description: 'Success `{ ok: true, events }`; owner does not exist `{ ok: false, reason: "unknown-owner" }`'
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  events:
                    type: object
                    description: label → trigger its petId; null = not triggered (cleared after reading)
                    additionalProperties:
                      type: [string, "null"]
                  reason:
                    type: string
                    description: "Reason for failure: `unknown-owner` (not registered/cleared/host restarted)"
                  message:
                    type: string
        "405":
          description: Method not allowed (only GET is accepted)

  /dsh-pet-7340/menu/click:
    post:
      tags: [Action]
      operationId: reportMenuClick
      summary: renderer reports menu clicks (internal channel, third-party does not adjust)
      description: |
        Called by browsers and desktops when the user clicks on a third-party menu item, mark the item as "clicked by this pet" and wake up the owner
        Hanging long polling. `delivered: false` (the item no longer exists, the renderer takes the previous tick snapshot) is a normal race condition, and 200 is still returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, label, pet]
              properties:
                owner:
                  type: string
                  example: 小游戏
                label:
                  type: string
                  example: 弹弓
                pet:
                  type: string
                  description: Which pet was clicked on (used to distinguish when there are multiple clicks)
                  example: main
      responses:
        "200":
          description: Report results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  delivered:
                    type: boolean
                    description: false = This item no longer exists (normal race condition, not an error)
        "405":
          description: Method not allowed (only POST is accepted)

  /dsh-pet-7340/todos:
    get:
      tags: [Action]
      operationId: listTodos
      summary: Read to-do list
      description: |
        Return to all to-dos, sorted by "unfinished first, due closer to the front, unlimited at the bottom, completed last".
        The data falls in the user directory of the plugin (`<DSH_HOME>/dsh-pet/todos.json`), and the browser and desktop share the same copy.

        **The reminder is driven by the host timer and does not depend on whether the page is open**: The closer to the expiration date, the denser the reminder——
        The reminder will start within 7 days (24 h → 12 h → 4 h → 1 h → 20 m → 5 m gradually becoming denser),
        Every 30 minutes for 1 day, every 6 hours for a week, and no more.
        A reminder can only be spoken by one visible desktop pet (the one visible on the web page takes precedence) and written into `pets.<id>.say`.
        If there is no client online (no long polling request is pending), the whole shot will be skipped, and the reminder will be added after a client is connected.
      responses:
        "200":
          description: To-do list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoListResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [Action]
      operationId: createTodo
      summary: Create a new to-do item
      description: |
        `text` required (1–200 code points after trim); `dueAt` optional, epoch milliseconds or `null` (unlimited).
        To-dos with no deadline will not trigger reminders, but will still appear in the list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 200
                  example: 交周报
                dueAt:
                  type: [integer, "null"]
                  description: Expiration time (epoch ms); `null` / not transmitted = no expiration date
                  example: 1793000000000
      responses:
        "200":
          description:
            "New result; if the text is empty/overlong or `dueAt` is invalid, `ok: false` + `bad-request` will
            be returned"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TodoResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'The request body is not a JSON object: `400` + `{"ok":false,"reason":"invalid-json"}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "413":
          description: 'The request body exceeds 16 KiB: `413` + `{"ok":false,"reason":"payload-too-large"}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/todos/{id}:
    patch:
      tags: [Action]
      operationId: updateTodo
      summary: Modify a to-do item
      description: |
        Write-only fields appearing in the request body, at least one of `text` / `dueAt` / `done` must be given (empty object returns `bad-request`).
        `completedAt` will be recorded when the check is completed; **re-opening or changing the deadline will clear the reminder for scheduling**, and the time will be reset according to the new status.
      parameters:
        - $ref: "#/components/parameters/TodoIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  maxLength: 200
                dueAt:
                  type: [integer, "null"]
                done:
                  type: boolean
      responses:
        "200":
          description: |-
            Update results. If id does not exist, it will return `ok: false` + `todo-not-found`; if the field is invalid, it will return `bad-request`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TodoResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'The request body is not a JSON object: `400` + `{"ok":false,"reason":"invalid-json"}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [Action]
      operationId: deleteTodo
      summary: Delete a to-do item
      description: "Idempotent: If id does not exist, it will return `ok: true` or `removed: 0`."
      parameters:
        - $ref: "#/components/parameters/TodoIdPath"
      responses:
        "200":
          description: Delete results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoRemovedResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

components:
  parameters:
    PetIdQuery:
      name: pet
      in: query
      required: true
      description: |
        Target pet id (`pets[].id` in configuration) - **required**.

        Not given / empty string / completely blank → `ok: false` + `reason: pet-required`;
        Given but this pet is not included in the configuration → `ok: false` + `reason: unknown-pet`.
        **No default value**: Never fall back to the "current desktop pet" or the first one in the list (issue #122 item 1),
        Therefore, the placement point of the same request will not change with the choice of user `/pet`.
        Containing dots and Chinese characters is allowed; **DO NOT** parse the path key returned by `/state` by `.` to get it.
      schema:
        type: string
      example: main

    SurfaceQuery:
      name: surface
      in: query
      required: true
      description: |
        ** caller desired renderer **——**required** (same level as `pet`, issue #122 item 1).

         `pet` only indicates "which one", not "which end". When a `display: desktop` pet is used as a web target,
         The host will still accept it, but **no renderer will consume it**: the caller will get `ok: true` but nothing will happen.
        I didn't realize something was wrong until the receipt timed out. This parameter turns that "inevitable impossibility" into an explicit failure in advance.

        Value:

        - `web` - must be displayed on the **webpage** (`display` is `web` / `both`);
        - `desktop` - must be displayed on the **desktop** (`display` is `desktop` / `both`);
        - `both` —— Both ends must be displayed (only matches `display: both`, which is stricter than "either end is OK");
        - `any` —— **Do not look at the display mode**: All four types of `display` are allowed, **including `none`** (for those who do not look at the rendering results)
          For consumer use, such as dialog windows: memory and return values have nothing to do with which end they are displayed on).

        Two types of failures (both HTTP 200 + `ok: false`):

        - Default/invalid (including case incompatibility, empty string) → `bad-request`;
        - Does not match the pet's `display` (`display: none` is only released by `any`) → `pet-not-displayed`,
          And **returns the actual `display`** of the pet, so the caller knows what to do at a glance.

        **This is pre-verification, not "distribution by face"**: the instructions are still written into the same leaf, and the content at both ends is still exactly the same.
        To "play A on the web page and B on the desktop", use **two pets** to express it (`display: web` / `display: desktop`).

        **Endpoint that does not accept this parameter**: `/lock/release` (The release must always be successful, otherwise the lock cannot be removed if the pet is hidden midway)
        Same as `GET /chat` (reading memory has nothing to do with which end the pet is displayed on).
      schema:
        type: string
        enum: [web, desktop, both, any]
      example: web

    LockQuery:
      name: lock
      in: query
      required: false
      description: |
        **Occupied lock number** (`lockId` returned by `POST /lock`, issue #122 item 4).

        - **When it is not currently occupied**: do not pass it → release it as usual (the existing caller can be used without moving, this is "do not pass lock = status quo"
          "Zero change" boundary); pass it → `lock-lost` + `cause`, because bringing the number means you think you still hold it,
          And the lock has expired / been released / taken away by the user.
        - When it is currently occupied: it must be passed, and it must be the currently valid number. Not transmitted → `lock-required`;
          Passed but not matched → `lock-lost` (with `cause`).
        - During the occupation period, only the lock holder can operate this pet. Unrestricted user interaction: dragging/clicking on the pet will directly remove the occupation
          (`force` form of `POST /lock/release`, reported by renderer).
      schema:
        type: string
      example: lk-mfh2k1-1

    AssetFile:
      name: file
      in: path
      required: true
      description: |
        File name, can contain subdirectories. The meme is `memes/<asset-root>/<name>.png` (the old form `memes/<name>.png` is also acceptable),
        The notification icon is `<name>.png`.
      schema:
        type: string

    TodoIdPath:
      name: id
      in: path
      required: true
      description: Pending id (`todos[].id` returned by `GET /todos`); only accepts URL security character.
      schema:
        type: string
      example: todo-mfh2k1-1

  responses:
    MethodNotAllowed:
      description:
        'This method is not supported: `405` + `{ "ok": false, "reason": "method-not-allowed", "message": "..."
        }`'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailureResponse"

    InternalError:
      description:
        'Host unexpected exception: `500` + `{ "ok": false, "reason": "internal-error", "message": "..." }` (the
        real reason is only entered in the host log)'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailureResponse"

  schemas:
    PetMemoryPage:
      type: object
      required: [ok, items, nextCursor]
      properties:
        ok: { const: true }
        nextCursor: { type: [string, "null"] }
        items:
          type: array
          maxItems: 10
          items:
            type: object
            required: [id, revision, stateVersion, kind, text]
            properties:
              id: { type: string }
              revision: { type: integer, minimum: 1 }
              stateVersion: { type: integer, minimum: 0 }
              kind: { type: string }
              text: { type: string }
    PetMemoryEvidence:
      type: object
      required: [ok, evidence]
      properties:
        ok: { const: true }
        evidence:
          type: object
          required: [revision, createdAt, sources]
          properties:
            revision: { type: integer, minimum: 1 }
            createdAt: { type: [string, "null"] }
            sources:
              type: array
              maxItems: 3
              items:
                type: object
                required: [id, type]
                properties:
                  id: { type: string }
                  type: { type: string }
                  excerpt: { type: string, maxLength: 2000 }

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
      description: Action completed. Please read data from `GET /state`.

    FocusSessionResponse:
      type: object
      required: [ok, sessionId, ts]
      properties:
        ok:
          type: boolean
          const: true
        sessionId:
          type: string
          description: Session id has been written (leading and trailing blanks have been trimmed).
        ts:
          type: integer
          description: |
            Writing time (milliseconds). consumer compares it with its own "processed water level",
            Jump only when it is greater than the water level - the page will be replayed later than the write load and will not be swallowed up by the first pull baseline.
      description: |
        Intent has been written to `sections.focusSession`. This does not mean that the page has been switched:
        The page switches only when the leaf is polled and `ts` is greater than the local water level.

    SayResponse:
      type: object
      required: [ok, text]
      properties:
        ok:
          type: boolean
          const: true
        text:
          type: string
          description: |
            The text generated this time. It is the same variable as `text` that is written to `pets.<id>.say` at the same time——
            The two exits give the same text, and there is no "one copy for the interface and one copy for the state flow".
        image:
          type: string
          description: |-
            The name of the meme displayed along with the text (only available when the entry has pictures turned on and hits the pool; otherwise, this field does not appear).
      description: |
        Generated successfully. The text is still written to `pets.<id>.say` - other consumers (web pages, desktops, third-party monitors)
        Continue reading from `/state`; the return value only saves the initiating party a round trip and does not change any existing display links.

    FailureResponse:
      type: object
      required: [ok, reason]
      properties:
        ok:
          type: boolean
          const: false
        reason:
          type: string
          description: |
            Failure reason classification. `bad-request` parameter is invalid (empty text/overlong), `provider-missing` is not available
            Dialog service provider, `generate-error` generated or IO failed, `pet-required` required pet not given
            (Default/empty string/all blank), the desktop pet specified by `unknown-pet` does not exist,
             The picture of `unknown-image` is not in the meme pool, and the animation name of `unknown-animation` is not in the pool.

            There are three other occupation locks (issue #122 item 4): `locked` The pet has been occupied by others (with `expiresAt`),
             `lock-required` is currently occupied but not transmitted. `lock` and `lock-lost` are transmitted. `lock` is not the currently effective one.
            (With `cause`).

             renderer alignment (issue #122 Item 1) There is another one: `pet-not-displayed` for this pet `display`
            `surface` in the request is not satisfied (with `display` = the **actual** display mode of the pet).

            There is another live version (`GET /pose`): `pose-unavailable` is configured to be displayed on the desktop, but the renderer has not been received yet
            Report (desktop is not up/just restarted).

            The receipt and third-party menu are also: `unknown-playback` (the number does not exist or has expired),
             `unknown-owner` (this owner has not been registered). The missing host capability is `unsupported`.
            The user layer configuration corruption is `user-config-unparsable` (with `needConfirm`, `userFile`).

            Reason for protocol failure (`invalid-json`/`method-not-allowed`/`payload-too-large`/
             `internal-error`) also appears in this entity, but the status code is not 200.
          enum:
            [
              bad-request,
              provider-missing,
              generate-error,
              pet-required,
              unknown-pet,
              unknown-image,
              unknown-animation,
              unknown-owner,
              unknown-playback,
              sleeping,
              no-sleep-animations,
              locked,
              lock-required,
              lock-lost,
              pet-not-displayed,
              pose-unavailable,
              unsupported,
              user-config-unparsable,
            ]
        cause:
          type: string
          description: |
            Only `lock-lost` has: Why is this lock missing?——`expired` was not renewed in time, `released` has been released,
             `preempted` was taken over by **user** (drag / click / hide / close), `unknown` does not recognize this number.
          enum: [expired, released, preempted, unknown]
        expiresAt:
          type: integer
          format: int64
          description: |-
            Only `locked` zone: current occupation **until when** (epoch milliseconds). Use this to decide when to try again.
          example: 1755000030000
        display:
          type: string
          description: |
            Only `pet-not-displayed` with: the **actual** display mode of this pet (`web` / `desktop` / `both` /
             `none`), the caller decides whether to change to `surface` or `pet` accordingly.
          enum: [web, desktop, both, none]
          example: desktop
        message:
          type: string
          description: Human-readable additional description (optional)

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    PlaybackRecord:
      type: object
      description:
        A record of a playback request (the response body of `GET /playback/{id}` is its shallow copy +
        `matched`).
      required: [playbackId, petId, name, status, createdAt, updatedAt, matched]
      properties:
        playbackId:
          type: string
        petId:
          type: string
          description: Target desktop pet id
        name:
          type: string
          description: Animation name (i.e. asset file name)
        status:
          type: string
          enum: [accepted, playing, ended, failed, cancelled]
        createdAt:
          type: integer
          description: Acceptance time (epoch milliseconds)
        updatedAt:
          type: integer
          description: The latest status change time (epoch milliseconds)
        endedAt:
          type: integer
          description: Appears only when status is `ended` (the moment it enters the final state)
        reason:
          type: string
          description: |
            Appears only when `failed` / `cancelled`. Current value: `asset-load` (asset not obtained)/
             `decode-error` (Decoding failed)/ `play-rejected` (Auto play rejected)/
             `busy` (mobile system occupied, this playback request could not be played)/ `superseded` (interrupted or dismissed)/
             `frozen` (interrupted by **occupied lock** freezing - unfreezing goes back to idle / recovery state, **will not take it back**,
            So it really won't finish playing, it's "interrupted" rather than "paused").
        matched:
          type: boolean
          description: "`true` = Wait until the state in `wait` is reached; `false` = Return after timeout"

    PollState:
      type: object
      required: [counter, sections, pets]
      description: |
        Unified status S. Each leaf is `{ counter, data }`; the change of `counter` means that the leaf has been updated.
        The top-level `counter` is the version number of the entire S (not a leaf), and the configuration change signal is also a leaf (`sections.config`).
      properties:
        counter:
          type: integer
          format: int64
          minimum: 0
          description: |
            The version number of the entire S = **the last written number** (top level, not leaf: no `data`, does not participate in leaf comparison).
            Returning it as `?since=` expresses "Which version is this in my hand?"; if it is different from the current one, it means something has changed.
             `0` = Never wrote any leaves. It is naturally equal to the largest one among all leaves counter (global single point increment).
          example: 1755000000007
        sections:
          type: object
          description: Global segment (shared by all ends)
          required: [balance, workStatus, notify, config, focusSession]
          properties:
            balance:
              $ref: "#/components/schemas/BalanceLeaf"
            workStatus:
              $ref: "#/components/schemas/WorkStatusLeaf"
            notify:
              $ref: "#/components/schemas/NotifyLeaf"
            config:
              $ref: "#/components/schemas/ConfigLeaf"
            focusSession:
              $ref: "#/components/schemas/FocusSessionLeaf"
        pets:
          type: object
          description: One copy for each pet; the key is pet id (**can include dots, do not split**)
          additionalProperties:
            type: object
            required: [say, anim, position, throw, lock, sleep]
            properties:
              say:
                $ref: "#/components/schemas/SayLeaf"
              anim:
                $ref: "#/components/schemas/AnimLeaf"
              position:
                $ref: "#/components/schemas/PositionLeaf"
              throw:
                $ref: "#/components/schemas/ThrowLeaf"
              lock:
                $ref: "#/components/schemas/LockLeaf"
              sleep:
                $ref: "#/components/schemas/SleepLeaf"
      examples:
        typical:
          summary: A pet with balance and whisper
          value:
            counter: 1755000000600
            sections:
              balance:
                counter: 1755000000000
                data:
                  ok: true
                  provider: deepseek-official
                  shape: money
                  data:
                    wallets:
                      - currency: CNY
                        total: "42.00"
                        granted: "10.00"
                        toppedUp: "32.00"
                        fullBalance: "20"
              workStatus:
                counter: 1755000000100
                data:
                  state: working
                  task: 正在读取 src/host/index.ts
              notify:
                counter: 1755000000200
                data:
                  type: session/event
                  event:
                    type: turn/end
                    data:
                      reason:
                        kind: completed
              config:
                counter: 1755000000600
                data: {}
            pets:
              main:
                say:
                  counter: 1755000000300
                  data:
                    text: 主人今天也要加油哦～
                    image: 可爱
                anim:
                  counter: 1755000000400
                  data:
                    name: 东张西望
                    playbackId: pb-mfh2k1-1
                position:
                  counter: 1755000000500
                  data:
                    x: 0.5
                    y: 0.35
                    mode: spring
                throw:
                  counter: 0
                  data:

    BalanceLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            `BalanceState`; `null` = never written.
            Refreshed periodically by host (`eventsRefreshSec.balance`, default 1800 seconds) or written by `POST /balance`.
          oneOf:
            - $ref: "#/components/schemas/BalanceView"
            - $ref: "#/components/schemas/BalanceUnavailable"
            - type: "null"

    BalanceView:
      type: object
      required: [ok, provider, shape]
      description: Balance available
      properties:
        ok:
          type: boolean
          const: true
        provider:
          type: string
          example: deepseek-official
        shape:
          type: string
          description: |
            Display form. `windows` = three-window usage (percentage, opencode / commandcode);
             `money` = account amount (DeepSeek two routes);
             `points` = points/point balance (non-monetary unit, such as the limit provided by the local gateway).
          enum: [windows, money, points]
        manual:
          type: boolean
          description: |
            Only when this write is **manually triggered** (`POST /balance`, `/balance` commands, desktop "View Balance" menu)
            appear when. Based on this, the consumer decides whether to have to display a text explanation when the balance is unavailable.
        rolling:
          type: number
          description: "opencode / commandcode: 5 h rolling window usage (0-100)"
        weekly:
          type: number
          description: "opencode / commandcode: Weekly window usage (0-100)"
        monthly:
          type: number
          description: "opencode / commandcode: Monthly window usage (0-100)"
        rollingResetsAt:
          type: string
          format: date-time
          description: "opencode / commandcode: rolling window (5 h) reset time"
        weeklyResetsAt:
          type: string
          format: date-time
          description: "opencode / commandcode: Weekly window reset time"
        monthlyResetsAt:
          type: string
          format: date-time
          description: "opencode / commandcode: Month window reset time"
        rollingCapUsd:
          type: number
          description:
            'commandcode: The rolling window (5 h) is full of quota (USD, interface return) - used to determine
            the "most urgent window"'
        weeklyCapUsd:
          type: number
          description: "commandcode: Weekly window full quota (USD, interface return)"
        monthlyCapUsd:
          type: number
          description:
            "commandcode: Monthly window full quota (USD) = current consumption + remaining quota; default when
            there is no quota or consumption"
        usage:
          type: object
          description: |
            windows: The cumulative usage of the interval (accumulated in this period), currently only commandcode is returned.
            If the service provider cannot provide it, the entire field will be defaulted, and the bubble will only have two pages.
             tokens is the gross value - the interface does not provide cache hit splitting; requests and tokens come from the batch aggregate,
            There may be a lag of several minutes behind the window percentage.
          required: [totalTokens, inputTokens, outputTokens, requests, spentUsd]
          properties:
            totalTokens:
              type: integer
              description: Total interval token
            inputTokens:
              type: integer
              description: Gross input token (including the cache hit part, the interface will not be split)
            outputTokens:
              type: integer
              description: Output token
            requests:
              type: integer
              description: Number of interval requests (including failed requests)
            spentUsd:
              type: number
              description: Interval cost (USD)
        wallets:
          type: array
          description: |
            money: Multi-currency wallet, **one for each currency**. The account may hold CNY and USD at the same time (such as "USD 0.00 + CNY has balance"),
            So it is an array; the benchmarks of different currencies cannot be converted to each other, and the proportions of each are calculated and then superimposed.
            The display layer selects symbols, filters to 0 currencies (negative numbers are to be displayed), and conversion states accordingly.
          items:
            type: object
            required: [currency, total, granted, toppedUp]
            properties:
              currency:
                type: string
                example: CNY
              total:
                type: string
                description:
                  The total balance of this currency (character string, consistent with the upstream; **may
                  be a negative number = overdraft**)
                example: "8.16"
              granted:
                type: string
                description:
                  Gift quota (the official route is transmitted as is; the account route is allocated
                  according to the gift wallet of the same currency, otherwise "0.00")
                example: "3.85"
              toppedUp:
                type: string
                description: Recharge amount
                example: "4.31"
              fullBalance:
                type: string
                description: |
                  The tier basis of this currency (same currency unit) - balance ≥ this value is considered not consumed.
                  Default = This currency has no basis and does not participate in state conversion (do not guess one for it). DeepSeek: CNY 20/USD 5.
                example: "20"
        points:
          type: object
          description: |
            points: Points/point balance (non-monetary unit). `unit` is just a display suffix after the number.
            Does not participate in any calculation (different from the division of labor of `wallets[].currency`: that is the currency code).
             The bubble is rendered as "Balance 800 points" without currency symbols.
          required: [unit, total]
          properties:
            unit:
              type: string
              description: Display unit (such as "points" and "points")
              example: 积分
            total:
              type: string
              description:
                Current balance (character string, consistent with the upstream; no conversion or
                recalculation)
              example: "800"
            full:
              type: string
              description: |
                Gear level reference (same value as unit) - balance ≥ this value is considered unconsumed.
                Default = no benchmark, no percentage conversion, no state animation (no guessing for it).
              example: "1000"

    BalanceUnavailable:
      type: object
      required: [ok, provider, reason]
      description: Balance not available (marked explicitly, not silently)
      properties:
        ok:
          type: boolean
          const: false
        provider:
          type: string
        manual:
          type: boolean
          description: Same as `BalanceView.manual`
        reason:
          type: string
          enum: [unsupported, credential-missing, fetch-error]
          description: |
            `unsupported` = This service provider does not support balance checking;
             `credential-missing` = Missing voucher;
             `fetch-error` = Fetch failed.
        message:
          type: string

    WorkStatusLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            `WorkStatusSnapshot`; `null` = never written.
            Monitor DSH session events (`turn/start`, `tool/call`, `tool/result`,
             `approval/asked`, `turn/end`) aggregate and then written; it can also be written by `POST /work-status`
            Write to fixed slot `api` externally.
          oneOf:
            - $ref: "#/components/schemas/WorkStatusSnapshot"
            - type: "null"

    WorkStatusSnapshot:
      type: object
      required: [state, task]
      properties:
        state:
          description: |
            Working status state, corresponding to the index of the configuration `animations.events.workStatus` array.
             `null` = Idle.
          oneOf:
            - type: string
              enum: [thinking, working, result, waiting, success, error]
            - type: "null"
        task:
          description: Current task details (provided by todo / write tool), can be `null`
          oneOf:
            - type: string
            - type: "null"

    NotifyLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            Notification frame; `null` = never written.
            It is generated by the host listening to the DSH host event, and the browser polls to see the change and then pops up the system toast.
            **Single slot**: New notifications directly overwrite old ones without queuing (only the latest one will be processed in the same poll under 1 second polling).
          oneOf:
            - $ref: "#/components/schemas/NotifyFrame"
            - type: "null"

    ConfigLeaf:
      type: object
      required: [counter, data]
      description: |
        Configuration-change signal. `data` is always `{}`; a changed `counter` tells consumers to fetch
        `GET /config` again. Sending only a signal avoids repeating the full configuration in every state poll.

        `POST /pet-display` and `POST /pet-config` write the signal for changes initiated by other clients.
        `PUT /config` and `POST /config` return the updated configuration directly and do not write it.
        Manual edits to `main-config.jsonc` or `pet/*.json` require a reload: the host does not poll file mtimes.
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          type: object
          description: Always `{}` (empty object). Don't read configuration content from here - go to `GET /config`.
          maxProperties: 0

    FocusSessionLeaf:
      type: object
      required: [counter, data]
      description: |
        **Jump session command** (one-time signal). `data` is `{ sessionId, ts }`, written by `POST /focus-session`.
         `data` means `null` has never been written.
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          oneOf:
            - type: "null"
            - type: object
              required: [sessionId, ts]
              properties:
                sessionId:
                  type: string
                  description: Target session id (leading and trailing blanks have been trimmed).
                ts:
                  type: integer
                  format: int64
                  description:
                    Writing time (milliseconds). The consumer will be judged accordingly and will not be
                    refunded.

    NotifyFrame:
      oneOf:
        - $ref: "#/components/schemas/TurnEndFrame"
        - $ref: "#/components/schemas/ApprovalFrame"
        - $ref: "#/components/schemas/QuestionFrame"
        - $ref: "#/components/schemas/AgentErrorFrame"
      discriminator:
        propertyName: type
        mapping:
          session/event: "#/components/schemas/TurnEndFrame"
          approval/requested: "#/components/schemas/ApprovalFrame"
          question/requested: "#/components/schemas/QuestionFrame"
          host/agent-error: "#/components/schemas/AgentErrorFrame"

    TurnEndFrame:
      type: object
      required: [type, event]
      description:
        The end of a round (only `completed` / `error` / `max-tokens` will be notified; `aborted`, etc. will
        not be notified)
      properties:
        type:
          type: string
          const: session/event
        sessionId:
          $ref: "#/components/schemas/NotifySessionId"
        event:
          type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: turn/end
            data:
              type: object
              properties:
                reason:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: [completed, error, max-tokens]
                    error:
                      type: object
                      properties:
                        message:
                          type: string

    ApprovalFrame:
      type: object
      required: [type]
      description: The model is applying for tool permissions
      properties:
        type:
          type: string
          const: approval/requested
        sessionId:
          $ref: "#/components/schemas/NotifySessionId"
        toolName:
          type: string
          description: Tool name to apply for permission (optional)
        reason:
          type: string
          description: Reason for application (optional)

    QuestionFrame:
      type: object
      required: [type, questions]
      description: The model calls the `ask_user_question` tool and is waiting for the user's answer.
      properties:
        type:
          type: string
          const: question/requested
        sessionId:
          $ref: "#/components/schemas/NotifySessionId"
        questions:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              question:
                type: string

    AgentErrorFrame:
      type: object
      required: [type, message]
      description: |
        Generation failure without a turn position, from DSH 0.1.5+ `agent/error` events.
        The payload has no `sessionId`, so clicking the notification only brings the window forward without selecting a session.
      properties:
        type:
          type: string
          const: host/agent-error
        message:
          type: string

    NotifySessionId:
      type: string
      description: |
        The session id that issued this notification (host is taken from the session parameter of `session/event`; this field is missing when the true id cannot be obtained).
        When the notification is clicked, the web page jumps to the session (client `uiWorkspace.openSession`);
        Missing (old version host / event that cannot get session location) = just call the window back to the foreground, without making any guesses.

    AnimLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            The animation to be played by this pet; `null` = Never written.
            counter is incremented every time it is written, so **the same animation will be treated as two instructions by the consumer if it makes two consecutive playback requests**
            (Replay). Two forms: `name` (the name is the asset file name `/thumb/<asset-root>/<name>.webm`, so the name
            Must exist in the pet's animation pool) or `url` (the complete address provided by the third party, without checking the pool) - exactly one of the two,
            Both are guaranteed by `POST /anim` before writing.
          oneOf:
            - $ref: "#/components/schemas/Anim"
            - type: "null"

    Anim:
      type: object
      description: |
        An animation to be played. `name` is **exactly one** from `url` (guaranteed by `POST /anim` before writing).
         `facing` **Optional**: The field is absent = the caller does not specify the orientation, and the consumer **does not move in the orientation** (not fallback `left`).
      properties:
        name:
          type: string
          description: |
            The name of the animation to be played (equal to a name that can be clicked on the menu in the `animations` configuration).
             Consumer presses "asset root + name" to spell `/thumb/<asset-root>/<name>.webm` to change the source, and go to **menu semantics**
            (For the text type, the mirror image to the left is forced to be corrected first, for the mobile type, the real displacement is performed, and the rest are played again).
          example: 东张西望
        url:
          type: string
          description: |
            The asset **address** to be played (provided by the third party, complete URL, issue #122 item 1).
             consumer **directly treats it as src without following menu semantics** - the naked address does not have "whether it is a text type / whether it is a mobile type"
            These attributes are only used to "insert a section" (return to the normal animation chain after playing).
            Parallel with `name`, **distinguished by field name** (not relying on `startsWith('http')` sniffing: the names happen to look similar
            address will be incorrect).
          example: https://cdn.example.com/拉侧栏.webm
        facing:
          type: string
          enum: [left, right]
          description: |
            The caller **explicitly specifies** the orientation (`POST /anim` of `facing`). **Field absent = not specified** → consumer
            **Fixed orientation** (Keep the pet's current orientation, not fallback `left`) - so "no requirement" and "requirement `left`" in shape
            It is distinguishable. Both forms `name` / `url` may have this field.
          example: right

    PositionLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            The position to which the pet will be moved; `null` = Never written.
            **This is a command, not a status report**: host writes, renderer reads to move the pet, renderer **does not write back**.
            Written by `POST /position`.
          oneOf:
            - $ref: "#/components/schemas/PositionCue"
            - type: "null"

    PositionCue:
      type: object
      required: [x, y, mode]
      properties:
        x:
          type: number
          description: Transverse normalized coordinates of pet **center** (`0~1`, host has been clamped before writing)
        y:
          type: number
          description:
            Longitudinal normalized coordinates of pet **center** (`0~1`, host has been clamped before
            writing)
        mode:
          type: string
          enum: [instant, spring, line]
          description: |-
            Movement mode: `instant` reaches the target position in one frame / `spring` passes through the damping spring to catch up / `line` presses `duration` to complete the straight line.
        duration:
          type: number
          description: |
            **Only `mode: line` has this key** (not available in other modes): travel time (milliseconds), non-negative finite number,
             `0` = In place immediately.

    ThrowLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            The initial velocity at which this pet is thrown; `null` = Never written.
            **This is a command, not a status report**: host writes, renderer reads and throws, renderer **does not write back**.
            Written by `POST /throw`.
          oneOf:
            - $ref: "#/components/schemas/ThrowCue"
            - type: "null"

    ThrowCue:
      type: object
      required: [angle, power]
      properties:
        angle:
          type: number
          description: |-
            Direction, unit **degree**. `0` = straight right, **counterclockwise is positive** (`90` = straight up, `-90` = straight down).
        power:
          type: number
          exclusiveMinimum: 0
          description: |-
            Velocity multiplier. `1.0` = soft clamp speed **before** 1200 px/s (the actual initial velocity is about 1021 px/s).

    SayLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            This pet's speaking command; `null` = Never written. **Two forms**: `Say` (play a bubble) and
             `SayClear` (collapse the current bubble, written by `POST /bubble/clear`).
            ** whisper, command bubble, and conversation reply share this leaf** - the front end is originally the same display link
            (Same bubble slot, same batch of `events.whisper` animations).
          oneOf:
            - $ref: "#/components/schemas/Say"
            - $ref: "#/components/schemas/SayClear"
            - type: "null"

    SleepLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            The **sleeping state** of this pet; `null` = never written (considered awake). Written by `POST /sleep` / `POST /wake`.

            **The names of the three animation segments are selected by the host and written into the leaves together** (the outer layer is randomized, and the inner segment is randomized again), and the renderer plays it accordingly
            "Start (once) → Loop (infinite) → Get up (once)", don't choose again - otherwise different sets will be broadcast at both ends.

            **This is a state, not a command**: renderer reads it and decides whether to sleep or not. Random chain, automatic source when asleep (whisper /
            Balance/work status/to-do reminder) and manual triggers (talk/chat/playback request animation) will be treated as sleep;
            Can be dragged but maintained in sleeping position. The host side also skips the automatic loop and rejects the interface accordingly.
          oneOf:
            - $ref: "#/components/schemas/SleepState"
            - type: "null"

    SleepState:
      description: Two forms of sleeping status, distinguished by the `sleeping` field.
      oneOf:
        - $ref: "#/components/schemas/SleepOn"
        - $ref: "#/components/schemas/SleepOff"

    SleepOn:
      type: object
      required: [sleeping, start, loop, end]
      description: "Sleeping: The three animation names are selected by the host."
      properties:
        sleeping:
          type: boolean
          const: true
        start:
          type: string
          description: Transition to sleep (played once).
          example: 睡觉-开始
        loop:
          type: string
          description: Sleep loop (infinite broadcast, ended is not triggered).
          example: 睡觉-循环
        end:
          type: string
          description: Wake up and transition (play once); return to random chain after playing.
          example: 睡觉-起来

    SleepOff:
      type: object
      required: [sleeping]
      description: Awake (Han was just woken up).
      properties:
        sleeping:
          type: boolean
          const: false

    LockLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            The **occupied lock status** of this pet (issue #122 item 4); `null` = has never been written (considered not occupied).
            Written by `POST /lock` / `POST /lock/release`, the host will also write it again when it expires.
            (Expiration is lazy and there is no timer).

            **This is a state not an instruction** (different from `anim` / `position` / `throw` three): renderer reads it and decides
            "Do you want to freeze yourself" - random chain does not roll dice, pauses the current self-playing animation, ignores the balance and work status of **automatic** sources
            Performance; explicit instructions (`say` / `anim` / `position` / `throw`) are not blocked. The host cannot stop a segment that is currently playing
            Video, so "complete stillness" is ultimately executed by the renderer.

            **`expiresAt` is the only truth**: The host will not push "lock is gone" once at a certain point, and the renderer will release it regularly accordingly.
            Therefore, reading `expiresAt` **has passed** means that there is no lock (this must be done when the stale leaves are obtained after the page is refreshed).

            **Excluding `lockId` **: That is the lock holder's certificate, do not put `/state` that is readable by everyone.
          oneOf:
            - $ref: "#/components/schemas/LockState"
            - type: "null"

    LockState:
      description: There are two forms of lock occupation, distinguished by the `locked` field name.
      oneOf:
        - $ref: "#/components/schemas/LockOn"
        - $ref: "#/components/schemas/LockOff"

    LockOn:
      type: object
      required: [locked, expiresAt]
      description: "Being occupied by a third party: the pet should be frozen."
      properties:
        locked:
          type: boolean
          const: true
        expiresAt:
          type: integer
          format: int64
          description: How long will it be occupied this time (epoch milliseconds).
          example: 1755000030000

    LockOff:
      type: object
      required: [locked]
      description:
        "Not occupied (normal state: pet’s random animation, autonomous movement, whisper, balance, working status
        as usual)."
      properties:
        locked:
          type: boolean
          const: false

    Say:
      type: object
      required: [text]
      description: Play a bubble.
      properties:
        text:
          type: string
          description: Text to be displayed (empty text will be discarded by consumer)
        image:
          type: string
          description: |
            Optional picture **name** (not URL): configure the key of `memes`, which is the file name of the picture file (excluding extension).
            Appears only when the configuration turns on `whisperImageEnabled` / `chatImageEnabled` and hits the picture in the pool.
             consumer (browser/desktop) is spelled `/dsh-pet-7340/pic/memes/<asset-root>/<name>.png` according to the asset root
            Get the image, asset root = the pet's entry key (`assetRoot`).
            Parallel with `url`, **distinct by field name**; **Only `POST /broadcast` will write the url form**.
        url:
          type: string
          description: |
            Optional picture **address** (picture provided by the third party, complete URL, issue #122 item 1).
             The consumer directly treats it as `src`, **without spelling out the meme path**.
            Only `POST /broadcast` will write this field (`image` / `url` is guaranteed to be chosen by the host).
        duration:
          type: number
          minimum: 0
          description: |
            bubble display duration (milliseconds). **Default 10 seconds** (old host will run according to 10 seconds when this field is not written);
             `0` = Literal meaning "do not display" (valid value, consumer does not render this bubble).
            Only `POST /broadcast` will write this field (the default value is also filled in with an explicit value); whisper and conversation replies will not write it.
          example: 10000
        anim:
          type: boolean
          description: |
            Whether to link the `events.whisper` animation this time. **Default `true` ** (Old host will follow linkage when this field is not written);
            Explicit `false` = only play the bubble, without checking the animation pool or changing the source.
            Similarly, only `POST /broadcast` can write; whisper and conversation replies cannot be written.
          example: true
        voiceTo:
          type: string
          enum: [web, desktop]
          description: |
            **Which side should you pronounce this sentence**? Two value rules:
             The request plane (`POST /whisper`, `POST /broadcast`) with `?surface=` on the route——`surface=web`/`desktop`
            As it is, `both` / `any` is not enough to specify one end, so return to the second one; among them, `POST /broadcast` also requires body.
             `speak: true`, by default only bubble is played and this field is not written; other sources (periodic whisper, to-do reminder, conversation reply,
             `/chat` command) Derivation according to `display`: If `desktop` is included, write `desktop`, and only write `web` when displayed on the web page——
            As long as helper is running on the desktop, there will always be a window, and the web page may be closed at any time.
            Default = no one reads it. The consumer compares according to the end it is on: if there is no match, it will just play the bubble and make no sound; if there are multiple pages on the same end, they will compare each one.

    SayClear:
      type: object
      required: [clear]
      description: |
        ** clear command ** (the landing point of `POST /bubble/clear`): close the speech bubble currently displayed by the pet.
         When the renderer finds that `counter` changes and `data` is this shape, it closes the bubble and **does not move the animation being played**.

        Why is it necessary to have a separate form: consumer's `readSay` will judge empty text as invalid and skip the entire beat.
        So "clear" cannot be expressed by `{ "text": "" }`.
      properties:
        clear:
          type: boolean
          const: true
          description:
            Always `true`. The consumer only recognizes **strictly `true`**, and other values are treated as
            ordinary text.

    Counter:
      type: integer
      format: int64
      minimum: 0
      description: |
        Leaf version number. Each time an update is written, the value is `Date.now()` and **strictly increment**
        (Continuous writing with the same millisecond will give +1), and the host will not go backwards even if it is restarted.
        **Rely on it to determine "whether it has changed"**: if it is the same as the last recorded value, the rendering will be skipped.
         `0` means never written.

    MemorySetupModels:
      type: object
      required:
        [baseUrl, model, embeddingBaseUrl, embeddingModel, embeddingDimension]
      properties:
        baseUrl: { type: string, format: uri, maxLength: 2048 }
        model: { type: string, minLength: 1, maxLength: 200 }
        embeddingBaseUrl: { type: string, format: uri, maxLength: 2048 }
        embeddingModel: { type: string, minLength: 1, maxLength: 200 }
        embeddingDimension: { type: integer, minimum: 1, maximum: 65536 }
        embeddingSendDimensions: { type: boolean, default: true }

    MemorySetupRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            [
              action,
              memory,
              baseUrl,
              model,
              embeddingBaseUrl,
              embeddingModel,
              embeddingDimension,
            ]
          properties:
            action: { type: string, const: start }
            memory: { type: boolean, const: true }
            baseUrl: { type: string, format: uri, maxLength: 2048 }
            model: { type: string, minLength: 1, maxLength: 200 }
            apiKey:
              { type: string, maxLength: 4096, writeOnly: true, default: "" }
            embeddingBaseUrl: { type: string, format: uri, maxLength: 2048 }
            embeddingModel: { type: string, minLength: 1, maxLength: 200 }
            embeddingDimension: { type: integer, minimum: 1, maximum: 65536 }
            embeddingSendDimensions: { type: boolean, default: true }
            embeddingApiKey:
              { type: string, maxLength: 4096, writeOnly: true, default: "" }
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action: { type: string, enum: [retry, stop, cancel] }
        - type: object
          additionalProperties: false
          required: [action, kind, baseUrl]
          properties:
            action: { type: string, const: models }
            kind: { type: string, enum: [generation, embedding, chat] }
            baseUrl: { type: string, format: uri, maxLength: 2048 }
            apiKey:
              { type: string, maxLength: 4096, writeOnly: true, default: "" }

    MemoryModelDiscovery:
      oneOf:
        - type: object
          required: [ok, models]
          properties:
            ok: { type: boolean, const: true }
            models:
              type: array
              items:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
                  kind: { type: string, enum: [generation, embedding, other] }
        - type: object
          required: [ok, code, message]
          properties:
            ok: { type: boolean, const: false }
            code: { type: string }
            message: { type: string }

    MemorySetupStatus:
      type: object
      required: [ok, available]
      properties:
        ok: { type: boolean, const: true }
        available: { type: boolean }
        stage:
          type: string
          enum:
            [
              idle,
              checking,
              checking_embedding,
              checking_runtime,
              downloading,
              installing_python,
              installing_memory,
              starting,
              restoring,
              saving,
              ready,
              error,
              stopped,
              cancelling,
              cancelled,
            ]
        message: { type: string }
        errorCode:
          {
            type: string,
            description: "Known error code, unknown exception is uniformly setup_failed.",
          }
        busy: { type: boolean }
        canCancel: { type: boolean }
        startedAt:
          {
            type: integer,
            description: "The start time of this operation, Unix milliseconds.",
          }
        chatReady:
          {
            type: boolean,
            description:
              This DSH entry point is not responsible for chat configuration and is
              always false.,
          }
        memoryReady: { type: boolean }
        memoryEnabled: { type: boolean }
        memoryRunning: { type: boolean }
        configured: { type: boolean }
        canRetry: { type: boolean }
        retryDraft: { type: boolean }
        serverUrl: { type: string, format: uri }
        models:
          $ref: "#/components/schemas/MemorySetupModels"
        binding:
          type: object
          required: [chatMemory, chatMemoryRounds]
          properties:
            chatMemory:
              $ref: "#/components/schemas/ChatMemoryConfig"
            chatMemoryRounds: { type: integer, minimum: 0 }

    ChatMemoryConfig:
      type: object
      additionalProperties: false
      required:
        [
          backend,
          maxHistoryBytes,
          serverUrl,
          maxRecallBytes,
          recallLimit,
          timeoutMs,
        ]
      properties:
        backend: { type: string, enum: [native, powercontext], default: native }
        maxHistoryBytes:
          type: integer
          minimum: 0
          maximum: 131072
          default: 0
          description:
            UTF-8 bytes budget for recent history text; 0 clipped only by round number. Reserved by full
            round, without persona, timestamp, round questions or recall.
        serverUrl:
          type: string
          default: http://127.0.0.1:8000
          description:
            HTTPS or local HTTP address; embedding account numbers, passwords, query parameters and fragments
            is prohibited. Authentication tokens are only read from the host environment.
        maxRecallBytes:
          { type: integer, minimum: 512, maximum: 32768, default: 4096 }
        recallLimit: { type: integer, minimum: 1, maximum: 8, default: 3 }
        timeoutMs:
          { type: integer, minimum: 250, maximum: 10000, default: 1500 }

    PowerContextStatus:
      type: object
      required:
        [
          ok,
          backend,
          pending,
          captured,
          skipped,
          scopeId,
          recall,
          error,
          processing,
        ]
      properties:
        ok: { type: boolean, const: true }
        backend: { type: string, enum: [native, powercontext] }
        pending: { type: integer, minimum: 0 }
        captured: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        scopeId: { type: [string, "null"] }
        recall: { type: string, enum: [not_run, empty, ready, unavailable] }
        error: { type: [string, "null"] }
        processing:
          {
            type: string,
            description: Source reception and Memory extraction are in different stages.,
          }

    ChatMemoryMessage:
      type: object
      required: [role, content, ts]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: Message text (excluding images/action tags)
        ts:
          type: integer
          format: int64
          description: Write timestamp (milliseconds)
        image:
          type: object
          description: |
            The pictures uploaded by users in this round only appear in the user message; missing = no pictures are included in this round.
            What is saved is the DSH attachment reference (**excluding the image body**). To retrieve the image, you need to read back the bytes according to the reference; it is only for record display and does not enter the context.
          required: [attachmentId, mediaType, bytes, width, height]
          properties:
            attachmentId:
              type: string
              description: Content-addressed attachment identifier ( sha256 ), not file path
            mediaType:
              type: string
              enum: [image/png, image/jpeg, image/webp, image/gif]
            bytes:
              type: integer
              description: Number of bytes after encoding (used for integrity check when reading images)
            width:
              type: integer
            height:
              type: integer
        meme:
          type: string
          description: |
            The name of the meme assigned to AI in this round (the key to configure memes) only appears in the assistant message; missing = no picture.
            The name can be restored to a picture according to `/pic/memes/<asset-root>/<name>.png`; it is only for record display and does not enter the context.
        action:
          type: string
          description: |
            The action name (name in `animations.categories`) performed by AI in this round only appears in the assistant message;
            Missing = No action was performed this round. Similar to `meme`: only for chat history display, without entering the context.

    Provider:
      type: object
      required: [id, name, models]
      properties:
        id:
          type: string
        name:
          type: string
          description: Display name; if missing, fallback is `id`
        models:
          type: array
          description: Models under this service provider (empty array if not listed)
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string

    StorageEntry:
      type: object
      description: A persist to disk location
      properties:
        label:
          type: string
        path:
          type: string
      additionalProperties: true

    ModelSelection:
      type: object
      description: |
        Entry-level model specification. ** `provider` and `model` must be empty or non-empty at the same time**——
        Leave both blank = follow the model of the current conversation; filling in only one is considered an invalid configuration.
      required: [provider, model]
      properties:
        provider:
          type: string
        model:
          type: string

    Position:
      type: object
      required: [corner, marginX, marginY]
      properties:
        corner:
          type: string
          description: Stop corner
          enum: [top-left, top-right, bottom-left, bottom-right]
        marginX:
          type: number
          description: Horizontal margin (pixels)
        marginY:
          type: number
          description: Vertical margin (pixels)

    PetEntry:
      type: object
      description: Pet entry in the whitelist (input shape of `PUT /config`)
      required: [id, name, size, balanceEnabled, display, position]
      properties:
        id:
          type: string
          maxLength: 64
          description:
            Pet id. **The file name cannot contain invalid characters** (Windows reserved character + control
            character)
        name:
          type: string
          description: Display name; when left blank, the host will process it as `id` and issue an alarm.
        size:
          type: number
          exclusiveMinimum: 0
          description: Pet size (pixels)
        sizePercent:
          type: number
          minimum: 1
          default: 100
          description: |
            Upper limit of screen width (%, default 100, no upper limit). Convert the picture frame according to the screen width of the character body, `size` is still the upper limit of the picture frame:
            100 ≈ no limit (the display is the same as pressing px in a wide window); filling in 30–50 can make the vertical screen of the mobile phone significantly smaller.
            Fill in 150 and the character will be wider than the screen, but the frame will still be sandwiched by `size`.
            It is only parsed once when the page is loaded and needs to be refreshed after changing the window size.
            Only works on the browser side; desktop transparent windows always use `size`. Less than 1 or non-numeric fallback to 100.
        balanceEnabled:
          type: boolean
        whisperEnabled:
          type: boolean
          description: Whether to enable periodic whisper (**not gating** `POST /whisper`)
        workStatusEnabled:
          type: boolean
        fixedEnabled:
          type: boolean
          description: |
            Pet fixed: `true` = The random animation chain no longer draws the "Turn/Move" two states (the pet does not turn its own direction or move away by itself,
            Only broadcast standby and random small actions). **Only affects random chains** - right-click menu playback request, `POST /anim`,
            Event animations (balance/whisper/work status), click responses and drag and drop are not affected. Missing default `false`.
        display:
          type: string
          enum: [web, desktop, both, none]
          description: "Where to display: browser only / desktop only / both / neither"
        position:
          $ref: "#/components/schemas/Position"

    SaveConfigRequest:
      type: object
      required: [pets]
      properties:
        pets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PetEntry"
        notificationsEnabled:
          type: boolean
        whisperImageEnabled:
          type: boolean
        chatImageEnabled:
          type: boolean
        chatAnimationEnabled:
          type: boolean
          description: |
            Dialogue action linkage switch (global default): When turned on, all action lists under `animations.categories` will be given to the model during dialogue.
            The model selects one to perform on the spot when it fits the context; when it is turned off, it is pure text. This is what is written in the "Dialogue Action Linkage" in the "Global Switch" card on the settings page.
        confineToScreen:
          type: boolean
        voiceEnabled:
          type: boolean
          description: |
            Manual broadcast switch (global default): Whether whisper and dialogue replies triggered by right-click menu and slash command are read out.
            On the same level as `voiceWhisperEnabled` / `voiceTodoEnabled` / `voiceNotifyEnabled`, each is independent.
            This is what the "Manual Broadcast" switch in the "Voice Broadcast" card on the settings page says. Missing default `false`.
        voiceName:
          type: string
          description: |
            Tone id, the whitelist is one of the four Chinese timbres in `/voice/voices`; if it is written incorrectly or left blank, it means a configuration error.
            Alert and fallback to `zh-CN-XiaoyiNeural`. It is written in the tone drop-down of the "Voice Broadcast" card on the settings page.
        voiceVolume:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Playback volume coefficient: 0–1, 1 = maximum volume, 0 = mute; four types of voices share this volume.
            Only the playback loudness is changed, the audio is not resynthesized. This is what is written in the volume input box of the "Voice Broadcast" card on the settings page. Missing default 1.
        voiceWhisperEnabled:
          type: boolean
          description: |
            Do you want to read the period whisper (global default).
            This is what the "whisper broadcast" switch in the "voice broadcast" card of the settings page says. Missing default `false`.
        voiceTodoEnabled:
          type: boolean
          description: |
            Whether to read out the to-do reminder (global default).
            This is what the "To-Do Report" switch in the "Voice Report" card on the settings page says. Missing default `false`.
        chatMemory:
          $ref: "#/components/schemas/ChatMemoryConfig"
        voiceNotifyEnabled:
          type: boolean
          description: |
            Do you want to read out the working status report (global default): task completed / error / wait for you to confirm the state configuration.
            Work status copy; same orientation as system notification, only read when the user is not on this page. Only read the configured lines, not `task`.
            This is what the "Notification Broadcast" switch in the "Voice Broadcast" card on the settings page says. Missing default `false`.
        chatMemoryRounds:
          type: integer
          minimum: 0
          description: |
            Number of dialogue history items (global default): the number of recent historical rounds carried in each dialogue request, 1 round = 1 question 1 answer,
            0 = no history. `memory.json` saves all but does not delete, this value only determines how much to intercept into the context.
            This is what is written in the number input box in the "AI Model and Dialog Context" area of the settings page. Missing default 5.
        chatImageLimit:
          type: integer
          minimum: 0
          description: |
            The upper limit of the number of dialogue pictures (global default): the maximum number of meme lists sent to the model during the dialogue ("the first N pictures" = the ones written in front of the configuration
            The order in which N - `memes` is written is the order in which it takes effect. If you want to send out the pictures first, write them forward.)
            **0 = No limit (send all)**.
            Why you need it: The entire list must be attached to every message. token grows linearly with the number of sheets. After the limit, the upper limit of the image matching overhead is controllable.
            This is what is written in the number input box in the "AI Model and Dialog Context" area of the settings page. Missing default 10.

    PetConfigEntry:
      type: object
      description: |
        Entry configuration after combiner fills up. There are far more fields than `PetEntry` - also including
         `whisperPrompt`, `chatMemoryRounds`, `whisperModel`, `chatModel`, `memes`,
         `workStatusTexts`, `physics`, `animations`, `eventsRefreshSec`, `animationWeights`, etc.
        See package `assets/config.jsonc` for complete fields and default values (annotated, the only source of default values).
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: number
        balanceEnabled:
          type: boolean
        whisperEnabled:
          type: boolean
        workStatusEnabled:
          type: boolean
        fixedEnabled:
          type: boolean
          description:
            Pet fixed (random chain no longer draws "Turn/Move" two levels; active triggering is not
            affected)
        display:
          type: string
          enum: [web, desktop, both, none]
        position:
          $ref: "#/components/schemas/Position"
        whisperPrompt:
          type: string
          description: The pet’s persona prompt word (shared with whisper and dialogue)
        chatMemory:
          $ref: "#/components/schemas/ChatMemoryConfig"
        chatMemoryRounds:
          type: integer
          description: Dialogue memory rounds (1 round = 1 question 1 answer)
        whisperModel:
          $ref: "#/components/schemas/ModelSelection"
        chatModel:
          $ref: "#/components/schemas/ModelSelection"
        whisperImageEnabled:
          type: boolean
        chatImageEnabled:
          type: boolean
        chatAnimationEnabled:
          type: boolean
          description:
            Dialogue action linkage switch (when turned on, the model can choose one of the actions of
            categories to perform on the spot)
        chatImageLimit:
          type: integer
          minimum: 0
          description:
            The upper limit of the number of dialogue pictures (0 = no limit); only affects the dialogue
            picture selection, whisper only takes the selected picture
        memes:
          type: object
          description:
            Expression package pool - the key is the picture name, and the value is the contextual
            description of the picture (for model selection)
          additionalProperties:
            type: string
        workStatusTexts:
          type: array
          description:
            Working status bubble copywriting, the index is strictly aligned with
            `animations.events.workStatus`
          items:
            type: string
        eventsRefreshSec:
          type: object
          description:
            Periodic refresh interval (seconds). Both cycles are driven by host timers, the frontend does not
            poll them.
          properties:
            balance:
              type: integer
              default: 1800
              description: Balance refresh cycle
            whisper:
              type: integer
              default: 300
              description: periodic whisper interval
      additionalProperties: true

    Todo:
      type: object
      required: [id, text, dueAt, done, createdAt, updatedAt, completedAt]
      properties:
        id:
          type: string
          description: Unique within the instance; path segment of PATCH / DELETE
        text:
          type: string
          description: Text (1–200 code points after trim)
        dueAt:
          type: [integer, "null"]
          description: Expiration time (epoch ms); null = no expiry, never remind
        done:
          type: boolean
        createdAt:
          type: integer
        updatedAt:
          type: integer
        completedAt:
          type: [integer, "null"]
        lastRemindedAt:
          type: [integer, "null"]
          description: Last reminder time; internal field, front-end panel does not consume

    TodoListResponse:
      type: object
      required: [ok, todos]
      properties:
        ok:
          type: boolean
        todos:
          type: array
          items:
            $ref: "#/components/schemas/Todo"

    TodoResponse:
      type: object
      required: [ok, todo]
      properties:
        ok:
          type: boolean
        todo:
          $ref: "#/components/schemas/Todo"
        reason:
          type: string
          description: Reason for failure (such as `bad-request` / `todo-not-found`)
        message:
          type: string

    TodoRemovedResponse:
      type: object
      required: [ok, removed]
      properties:
        ok:
          type: boolean
        removed:
          type: integer
          description: Number of deleted items; 0 = None (idempotent)
