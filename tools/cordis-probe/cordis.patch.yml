# Mount the probe bundle in DSH's configuration tree.
# DSH plugin installation requires dsh.bundle.patch; dsh.client alone is insufficient.
# The entry ID must be globally unique and match the package name. Keep the ID line
# free of trailing comments for the store's regex-based preflight.
# The plugin manager installs the package and overlays this patch automatically;
# no manual profile dependency or bundle edits are needed.

- insert:
    - id: dsh-cordis-probe
      name: 'dsh-cordis-probe'
